name: Refresh tail convexity board

on:
  push:
    branches: [main]
    paths:
      - "tail-convexity-lib.js"
      - "tail-alert-lib.js"
      - "scripts/tail-alert.test.mjs"
      - "scripts/build-kindle-tail.mjs"
      - ".github/workflows/tail-notify.yml"
      - "scripts/update-btc-metrics.mjs"
      - "tail-convexity-load.js"
      - "scripts/update-tail-convexity.mjs"
      - "scripts/tail-convexity.test.mjs"
      - ".github/workflows/update-tail-convexity.yml"
  workflow_dispatch:
  schedule:
    - cron: "23,53 * * * *"

permissions:
  contents: write

concurrency:
  group: tail-convexity-snapshot-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pure strategy and market-page tests
        run: node --test scripts/tail-convexity.test.mjs scripts/market-page.test.mjs scripts/tail-alert.test.mjs

      - name: Refresh Binance put board
        id: scan
        run: node scripts/update-tail-convexity.mjs

      - name: Refresh Binance BTC, EMA200 and MA120 for Kindle
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        run: node scripts/update-btc-metrics.mjs

      - name: Build minimal Kindle-only static snapshot
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        run: node scripts/build-kindle-tail.mjs

      # A failed scan writes BLOCKED_DATA and exits nonzero. Publish this state,
      # but keep the GitHub Actions job failed rather than reporting false success.
      - name: Publish verified snapshot or blocked receipt
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        run: |
          git add -- tail-convexity.json btc-metrics.json kindle.html
          if git diff --cached --quiet; then
            echo "tail board unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh tail convexity board"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
