name: Refresh tail convexity board

on:
  workflow_dispatch:
  schedule:
    - cron: "23,53 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Binance put board
        run: node scripts/update-tail-convexity.mjs
        continue-on-error: true

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- tail-convexity.json; then
            echo "tail board unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tail-convexity.json
          git commit -m "chore: refresh tail convexity board"
          git push
