name: Test tail research
on:
  pull_request:
    paths:
      - "tail-convexity-lib.js"
      - "tail-alert-lib.js"
      - ".github/workflows/tail-notify.yml"
      - "tail-convexity-load.js"
      - "tail-board.js"
      - "scripts/**"
      - ".github/workflows/update-tail-convexity.yml"
      - ".github/workflows/test-tail-research.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pure strategy and market board tests
        run: node --test scripts/tail-convexity.test.mjs scripts/market-page.test.mjs scripts/tail-alert.test.mjs
      - name: Parse all runtime modules
        run: |
          node --check tail-convexity-lib.js
          node --check tail-alert-lib.js
          node --check scripts/tail-notify.mjs
          node --check scripts/build-kindle-tail.mjs
          node --check tail-convexity-load.js
          node --check tail-board.js
          node --check scripts/update-tail-convexity.mjs

  # Real public-data end-to-end scan on a PR branch. Never pushes to main/Pages.
  shadow-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulate the complete public Binance/DeFi scan (no orders)
        run: node scripts/update-tail-convexity.mjs
      - name: Verify shadow freshness, schema and evidence status
        run: node scripts/check-tail-health.mjs
      - name: Summarize research-only shadow results
        run: |
          node -e 'const s = require("./tail-convexity.json"); console.log(JSON.stringify({state:s.state,tail_state:s.tail_state,opportunity_state:s.opportunity_state,holdings:s.holdings,rank:s.board.map(x=>({symbol:x.symbol,tier:x.opportunity_tier,score:x.ranking_score,quality:x.quality.state,crash_scenarios:x.crash_scenarios.status})),funnel:s.funnel,evidence:s.radar.evidence,independent_protocol_coverage:s.radar.independent_protocol_coverage}))'
      - name: Generate Kindle static page from shadow scan
        run: node scripts/build-kindle-tail.mjs
      - name: Verify generated no-JavaScript Kindle view
        run: |
          grep -q "尾部 Put 研究简报" kindle.html
          if grep -q '<script' kindle.html; then exit 1; fi
      - name: Upload read-only shadow snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tail-research-v2-shadow
          path: |
            tail-convexity.json
            kindle.html
          retention-days: 7
