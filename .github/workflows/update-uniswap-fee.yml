name: Refresh Uniswap fee snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch real Uniswap data
        run: node scripts/update-uniswap-fee.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- uniswap-fee.json; then
            echo "Uniswap fee snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uniswap-fee.json
          git commit -m "chore: refresh Uniswap fee snapshot"
          git push
