name: Probe public Merkl and Meteora read endpoints
on:
  pull_request:
    paths:
      - "scripts/probe-lp-radar.mjs"
      - ".github/workflows/probe-lp-radar.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public REST endpoints with HTTP/status/schema diagnostics
        run: node scripts/probe-lp-radar.mjs
