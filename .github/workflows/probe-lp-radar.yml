name: Public LP opportunities radar
on:
  pull_request:
    paths:
      - "lp-radar-lib.js"
      - "lp-verification-lib.js"
      - "scripts/lp-verification.test.mjs"
      - "scripts/verify-merkl-rewards.mjs"
      - "scripts/sdk-probe/**"
      - "scripts/lp-radar.test.mjs"
      - "scripts/scan-lp-opportunities.mjs"
      - "scripts/probe-lp-radar.mjs"
      - ".github/workflows/probe-lp-radar.yml"
  push:
    branches: [main]
    paths:
      - "lp-radar-lib.js"
      - "lp-verification-lib.js"
      - "scripts/lp-verification.test.mjs"
      - "scripts/verify-merkl-rewards.mjs"
      - "scripts/sdk-probe/**"
      - "scripts/lp-radar.test.mjs"
      - "scripts/scan-lp-opportunities.mjs"
      - ".github/workflows/probe-lp-radar.yml"
  workflow_dispatch:
  schedule:
    # 08:17, 12:17, 16:17, 20:17 Asia/Taipei (UTC+8); GitHub schedule is best-effort.
    - cron: "17 0,4,8,12 * * *"
permissions:
  contents: write
concurrency:
  group: public-lp-radar-main
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pure LP screening and code syntax
        run: |
          node --check lp-radar-lib.js
          node --check lp-verification-lib.js
          node --check scripts/scan-lp-opportunities.mjs
          node --check scripts/verify-merkl-rewards.mjs
          node --check scripts/sdk-probe/meteora-read.mjs
          node --test scripts/lp-radar.test.mjs scripts/lp-verification.test.mjs
      - name: Refresh public Merkl and Meteora research snapshot
        run: node scripts/scan-lp-opportunities.mjs
      - name: Read Merkl active campaign rules
        run: node scripts/verify-merkl-rewards.mjs
        env:
          MERKL_PUBLIC_WALLET_ADDRESS: ${{ secrets.LP_MERKL_PUBLIC_WALLET_ADDRESS }}
      - name: Install pinned Meteora SDK without lifecycle scripts
        run: npm --prefix scripts/sdk-probe install --ignore-scripts --no-audit --no-fund
      - name: Read active bins and SDK quote without signing
        run: node scripts/sdk-probe/meteora-read.mjs
        env:
          SOLANA_RPC_URL: ${{ secrets.LP_SOLANA_RPC_URL }}
          LP_METEORA_POSITION_ADDRESS: ${{ secrets.LP_METEORA_POSITION_ADDRESS }}
      - name: Guard against unverified recommendations and private evidence
        run: |
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("lp-opportunities.json"));const m=JSON.parse(fs.readFileSync("lp-merkl-eligibility.json"));const s=JSON.parse(fs.readFileSync("lp-meteora-sdk.json"));if(x.merkl.best!==null||x.meteora.best!==null||m.best!==null||s.best!==null)throw Error("False verified LP");if(m.position_eligibility_verified||m.claimable_from_this_campaign_verified||s.full_lp_withdrawal_verified)throw Error("False proof");'
      - name: Publish CI snapshot as a review artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lp-opportunities-shadow
          path: |
            lp-opportunities.json
            lp-merkl-eligibility.json
            lp-meteora-sdk.json
          retention-days: 7
      - name: Persist public research snapshot on main
        if: github.event_name != 'pull_request'
        run: |
          git add -- lp-opportunities.json lp-merkl-eligibility.json lp-meteora-sdk.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh read-only LP opportunity shortlist"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
