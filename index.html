<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#eef2ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>市场</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef2ee;
        --surface: #f8faf7;
        --surface-strong: #ffffff;
        --text: #202925;
        --muted: #78847d;
        --strong: #2d3933;
        --up: #147c5b;
        --down: #b6535c;
        --pending: #a4773c;
        --shadow-card: 0 16px 32px rgba(43, 61, 50, 0.09), 0 3px 8px rgba(43, 61, 50, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.88);
        --radius-card: 16px;
      }

      * { box-sizing: border-box; }

      html {
        min-width: 0;
        min-height: 100%;
        background: var(--bg);
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-x: none;
      }

      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.95), transparent 35%),
          radial-gradient(circle at 96% 10%, rgba(214, 229, 218, 0.54), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a { color: inherit; }

      .skip-link {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--strong);
        color: var(--surface-strong);
        text-decoration: none;
        transform: translateY(-150%);
        transition: transform 160ms ease;
      }

      .skip-link:focus { transform: translateY(0); }

      .page {
        width: min(100%, 1760px);
        max-width: 100%;
        min-height: 100svh;
        margin: 0 auto;
        padding-top: max(18px, calc(env(safe-area-inset-top) + 18px));
        padding-right: max(clamp(16px, 3.4vw, 64px), calc(env(safe-area-inset-right) + 16px));
        padding-bottom: max(28px, calc(env(safe-area-inset-bottom) + 28px));
        padding-left: max(clamp(16px, 3.4vw, 64px), calc(env(safe-area-inset-left) + 16px));
      }

      .market-row,
      .market-ident,
      .market-quote {
        display: flex;
      }

      :focus-visible {
        outline: 2px solid var(--strong);
        outline-offset: 3px;
      }

      .market-section { margin-top: 0; }
      .market-list { display: grid; width: 100%; min-width: 0; max-width: 1680px; margin: 0 auto; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 0.8vw, 16px); }
      .market-row { min-width: 0; min-height: clamp(88px, 5.5vw, 108px); flex-direction: column; align-items: stretch; justify-content: space-between; gap: 6px; padding: clamp(14px, 1vw, 18px); border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }
      .market-row[data-market-state="stale"],
      .market-row[data-market-state="fallback"] { opacity: 0.84; }
      .market-ident { min-width: 0; flex: 0 0 auto; flex-direction: row; align-items: center; gap: 7px; }
      .market-symbol { color: var(--strong); font-size: clamp(16px, 1.15vw, 21px); font-weight: 600; line-height: 1.2; letter-spacing: -0.35px; }
      .market-stale-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pending); opacity: 0; flex: 0 0 auto; }
      .market-row[data-market-state="stale"] .market-stale-dot,
      .market-row[data-market-state="fallback"] .market-stale-dot { opacity: 0.9; }
      .market-source { display: none; }
      .market-quote { width: 100%; min-width: 0; flex: 1 1 auto; align-items: baseline; justify-content: flex-start; gap: clamp(18px, 1.6vw, 28px); }
      .market-price { display: inline-flex; min-width: 0; flex: 0 1 auto; align-items: baseline; justify-content: flex-start; gap: 0; overflow: visible; color: var(--text); font-size: clamp(28px, 2vw, 36px); font-weight: 600; line-height: 1; letter-spacing: -0.04em; white-space: nowrap; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "lnum" 1; }
      .market-price .digit { position: relative; display: inline-block; width: 0.70em; height: 1em; line-height: 1em; overflow: hidden; contain: paint; vertical-align: baseline; padding: 0 0.02em; box-sizing: content-box; }
      .market-price .sep { display: inline-block; width: 0.22em; margin: 0 -0.04em; text-align: center; opacity: 0.86; }
      .market-price .track { position: absolute; inset: 0; }
      .market-price .digit__num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-right: 0.03em; box-sizing: border-box; will-change: transform; }
      .market-change { min-width: 0; color: var(--muted); font-size: clamp(15px, 1.1vw, 20px); line-height: 1.2; text-align: right; white-space: nowrap; }
      .market-change.is-empty { display: none; }
      .market-change.up { color: var(--up); }
      .market-change.down { color: var(--down); }

      .market-row--btc { grid-column: 1 / -1; min-height: 0; gap: clamp(16px, 1.3vw, 22px); padding: clamp(22px, 1.6vw, 32px); background: var(--surface-strong); }
      .market-row--btc .market-symbol { font-size: clamp(16px, 1.15vw, 21px); }
      .market-row--btc .market-quote { flex: 0 0 auto; gap: clamp(24px, 2.2vw, 40px); }
      .market-row--btc .market-price { font-size: clamp(68px, 5vw, 96px); letter-spacing: -0.06em; }
      .market-row--btc .market-change { font-size: clamp(15px, 1.1vw, 20px); }
      .btc-metrics { display: grid; width: min(100%, 620px); max-width: 620px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(24px, 2.4vw, 40px); margin-top: 1px; padding-top: clamp(14px, 1.1vw, 20px); border-top: 1px solid rgba(120, 132, 125, 0.25); }
      .btc-metric { display: flex; min-width: 0; flex-direction: column; gap: 5px; }
      .btc-metric .market-symbol { color: var(--muted); font-size: clamp(13px, 0.95vw, 16px); letter-spacing: 0; }
      .btc-metric .market-price { font-size: clamp(28px, 2.1vw, 38px); letter-spacing: -0.045em; }

      .empty { padding: 22px 12px; color: var(--muted); font-size: 14.5px; line-height: 18px; text-align: center; }

      @media (max-width: 1024px) and (min-width: 561px) {
        .market-price { font-size: clamp(24px, 3vw, 32px); }
        .market-row--btc .market-price { font-size: clamp(48px, 6.5vw, 72px); }
        .btc-metric .market-price { font-size: clamp(28px, 3.4vw, 36px); }
        .market-row--btc { gap: 16px; }
      }

      @media (max-width: 560px) {
        .page { padding-top: max(14px, calc(env(safe-area-inset-top) + 14px)); }
        .market-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .market-row { min-height: 82px; gap: 6px; padding: 12px; }
        .market-symbol { font-size: clamp(14px, 3.9vw, 16px); }
        .market-quote { gap: 6px; }
        .market-price { font-size: clamp(20px, 5.6vw, 26px); }
        .market-change { font-size: clamp(11px, 3.1vw, 14px); }
        .market-row--btc { min-height: 0; gap: 14px; padding: 16px; }
        .market-row--btc .market-quote { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
        .market-row--btc .market-price { font-size: clamp(44px, 11vw, 56px); }
        .market-row--btc .market-change { font-size: clamp(14px, 4vw, 18px); }
        .btc-metrics { grid-template-columns: 1fr; gap: 12px; margin-top: 0; padding-top: 12px; }
        .btc-metric .market-symbol { font-size: 13px; }
        .btc-metric .market-price { font-size: clamp(25px, 7vw, 30px); }
      }

      @media (orientation: landscape) and (max-height: 620px) {
        .page { padding-top: max(12px, calc(env(safe-area-inset-top) + 12px)); }
        .market-row--btc { min-height: 170px; }
      }

      @media (max-width: 1399px) and (min-width: 901px) {
        .market-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (min-width: 1400px) {
        .market-list { max-width: 1520px; }
      }

      @media (max-width: 900px) and (min-width: 561px) {
        .market-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      }

      @media (min-width: 561px) {
        .page { display: flex; align-items: center; }
        .market-section { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#market">跳到市场行情</a>
    <main class="page">
      <section id="market" class="market-section" aria-label="市场行情">
        <div id="market-list" class="market-list" aria-live="off"><p class="empty">正在读取公开行情…</p></div>
      </section>
    </main>
    <script>
      (function () {
        "use strict";

        var CACHE_KEY = "btc-local-terminal-market-v1";
        var HYPERLIQUID_INFO_URL = "https://api.hyperliquid.xyz/info";
        var BINANCE_WS_URL = "wss://stream.binance.com:9443/ws/btcusdt@bookTicker";
        var OKX_WS_URL = "wss://ws.okx.com:8443/ws/v5/public";
        var HYPERLIQUID_WS_URL = "wss://api.hyperliquid.xyz/ws";
        var RENDER_MS = 350;
        var REST_FALLBACK_MS = 2000;
        var STONK_INTERVAL = 2000;
        var STATS_INTERVAL = 15000;
        var EMA_INTERVAL = 60000;
        var BTC_STALE_MS = 4000;
        var HL_STALE_MS = 8000;
        var STONK_STALE_MS = 12000;
        var EMA_STALE_MS = 180000;
        var EMA_PERIOD = 200;
        var EMA_CANDLE_LIMIT = 1000;
        var ANIM_MS = 450;
        var ANIM_EASE = "linear(0,.005,.019,.039,.066,.096,.129,.165,.202,.24,.278,.316,.354,.39,.426,.461,.494,.526,.557,.586,.614,.64,.665,.689,.711,.731,.751,.769,.786,.802,.817,.831,.844,.856,.867,.877,.887,.896,.904,.912,.919,.925,.931,.937,.942,.947,.951,.955,.959,.962,.965,.968,.971,.973,.976,.978,.98,.981,.983,.984,.986,.987,.988,.989,.99,.991,.992,.992,.993,.994,.994,.995,.995,.996,.996,.9963,.9967,.9969,.9972,.9975,.9977,.9979,.9981,.9982,.9984,.9985,.9987,.9988,.9989,1)";
        var HIP3_STOCK_DEX = "xyz";
        var STONK_SOLANA_ADDRESS = "6GmAFSYs4gk3FDao5FzzySQpPZaWsa4rUJHacpMpUNgx";
        var JUPITER_PRICE_URL = "https://lite-api.jup.ag/price/v3?ids=" + STONK_SOLANA_ADDRESS;
        var marketListElement = document.getElementById("market-list");
        var priceRequest = false;
        var statsRequest = false;
        var macroRequest = false;
        var stonkRequest = false;
        var emaRequest = false;
        var marketItemsById = {};
        var macroItemsById = {};
        var priceBuffer = {};
        var lastMarketStructure = null;
        var marketRowsById = {};
        var odometersById = {};
        var renderTimer = 0;
        var lastFlushAt = 0;
        var lastCacheWriteAt = 0;
        var btcPrimaryLive = false;
        var btcLastWsAt = 0;
        var hlPrimaryLive = false;
        var hlLastWsAt = 0;
        var cachedState = readCache();
        var macroDefinitions = [
          { id: "hype", label: "HYPE", source: "hyperliquid" },
          { id: "pons", label: "PONS", source: "hyperliquid" },
          { id: "stonk", label: "STONK", source: "solana", address: STONK_SOLANA_ADDRESS },
          { id: "spcx", label: "SPCX", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "SPCXUSDT" },
          { id: "mu", label: "MU", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "MUUSDT" },
          { id: "sndk", label: "SNDK", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "SNDKUSDT" },
          { id: "nvda", label: "NVDA", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "NVDAUSDT" }
        ];
        var marketDefinitions = [{ id: "btc", label: "BTC", source: "binance" }].concat([
          { id: "ema200", label: "EMA200", source: "btc-daily" },
          { id: "ma120", label: "MA120", source: "btc-daily" }
        ], macroDefinitions);

        if (cachedState) {
          if (cachedState.btc) renderBtc(cachedState.btc, true);
          if (finite(cachedState.ema200) !== null) renderEma200(cachedState.ema200, cachedState.ma120, true);
          if (cachedState.macro) renderMacro(cachedState.macro, true);
        }

        function finite(value) {
          if (value === null || value === undefined || value === "") return null;
          var number = Number(value);
          return isFinite(number) ? number : null;
        }

        function numberText(value, fraction) {
          var number = finite(value);
          if (number === null) return "";
          try {
            return new Intl.NumberFormat("en-US", {
              minimumFractionDigits: fraction,
              maximumFractionDigits: fraction
            }).format(number);
          } catch (error) {
            return number.toFixed(fraction);
          }
        }

        function pctText(value, fraction) {
          var number = finite(value);
          if (number === null) return "";
          var digits = typeof fraction === "number" ? fraction : 2;
          return (number >= 0 ? "+" : "") + number.toFixed(digits) + "%";
        }

        function requestJson(url, timeout, requestOptions) {
          if (window.fetch) {
            var controller = typeof AbortController === "function" ? new AbortController() : null;
            var timer = window.setTimeout(function () { if (controller) controller.abort(); }, timeout || 8000);
            var options = { cache: "no-store", mode: "cors" };
            if (requestOptions) {
              Object.keys(requestOptions).forEach(function (key) { options[key] = requestOptions[key]; });
            }
            if (controller) options.signal = controller.signal;
            var clearTimer = function () { window.clearTimeout(timer); };
            return window.fetch(url, options).then(function (response) {
              if (!response.ok) throw new Error("HTTP " + response.status);
              return response.json();
            }).then(function (value) {
              clearTimer();
              return value;
            }, function (error) {
              clearTimer();
              throw error;
            });
          }

          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            var method = requestOptions && requestOptions.method ? requestOptions.method : "GET";
            xhr.open(method, url, true);
            xhr.timeout = timeout || 8000;
            if (requestOptions && requestOptions.headers) {
              Object.keys(requestOptions.headers).forEach(function (key) { xhr.setRequestHeader(key, requestOptions.headers[key]); });
            }
            xhr.onreadystatechange = function () {
              if (xhr.readyState !== 4) return;
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); } catch (error) { reject(error); }
              } else reject(new Error("HTTP " + xhr.status));
            };
            xhr.onerror = reject;
            xhr.ontimeout = function () { reject(new Error("timeout")); };
            xhr.send(requestOptions && requestOptions.body ? requestOptions.body : null);
          });
        }

        function readCache() {
          try {
            window.localStorage.removeItem("btc-local-terminal-public-v7");
            var value = window.localStorage.getItem(CACHE_KEY);
            if (!value) return null;
            var parsed = JSON.parse(value);
            return parsed && parsed.savedAt ? parsed : null;
          } catch (error) {
            return null;
          }
        }

        function writeCache() {
          try {
            window.localStorage.setItem(CACHE_KEY, JSON.stringify({
              savedAt: Date.now(),
              btc: cachedState && cachedState.btc,
              macro: cachedState && cachedState.macro,
              ema200: cachedState && cachedState.ema200,
              ma120: cachedState && cachedState.ma120
            }));
          } catch (error) {
            // Private browsing or a restricted browser may disable storage.
          }
        }

        function sourceMeta(symbol, fallback) {
          var value = typeof symbol === "string" ? symbol : "";
          if (value.indexOf("HYPERLIQUID:") === 0) return "hyperliquid";
          if (value.indexOf("DEXSCREENER:") === 0) return "dexscreener";
          if (value.indexOf("JUPITER:") === 0) return "jupiter";
          if (value.indexOf("OKX:") === 0) return "okx";
          if (value.indexOf("BINANCE:") === 0 || value.indexOf("BINANCE-") === 0) return "binance";
          return fallback || "public";
        }

        function priceFraction(value) {
          return 2;
        }

        function formatPriceText(value) {
          var number = finite(value);
          if (number === null) return "";
          return numberText(number, priceFraction(number));
        }

        function priceTemplate(text) {
          return String(text || "").replace(/[0-9]/g, "#");
        }

        function normalizedChange(item) {
          if (!item) return null;
          return finite(item.change !== undefined ? item.change : item.change24h);
        }

        function replaceChildrenCompat(element, child) {
          while (element.firstChild) element.removeChild(element.firstChild);
          element.appendChild(child);
        }

        function staleLimit(id) {
          if (id === "btc") return BTC_STALE_MS;
          if (id === "ema200" || id === "ma120") return EMA_STALE_MS;
          if (id === "stonk") return STONK_STALE_MS;
          return HL_STALE_MS;
        }

        function lookupMid(mids, label, dex) {
          if (!mids) return null;
          var keys = dex ? [dex + ":" + label, label, label + "USDT"] : [label];
          for (var index = 0; index < keys.length; index += 1) {
            var price = finite(mids[keys[index]]);
            if (price !== null) return price;
          }
          return null;
        }

        function createPriceOdometer(element) {
          var currentTemplate = "";
          var lastShown = "";
          var inited = false;
          var digitCellHeight = 0;

          function cancelAnimations(node) {
            if (!node || typeof node.getAnimations !== "function") return;
            node.getAnimations().forEach(function (animation) { animation.cancel(); });
          }

          function buildOdometer(text) {
            while (element.firstChild) element.removeChild(element.firstChild);
            for (var index = 0; index < text.length; index += 1) {
              var character = text.charAt(index);
              if (character >= "0" && character <= "9") {
                var digit = document.createElement("span");
                digit.className = "digit";
                digit.dataset.value = character;

                var track = document.createElement("span");
                track.className = "track";
                for (var number = 0; number <= 9; number += 1) {
                  var cell = document.createElement("span");
                  cell.className = "digit__num";
                  cell.textContent = String(number);
                  cell.dataset.num = String(number);
                  track.appendChild(cell);
                }

                digit.appendChild(track);
                element.appendChild(digit);
              } else {
                var separator = document.createElement("span");
                separator.className = "sep";
                separator.textContent = character;
                element.appendChild(separator);
              }
            }
          }

          function refreshCellHeight() {
            var digit = element.querySelector(".digit");
            if (digit) digitCellHeight = digit.getBoundingClientRect().height || digitCellHeight;
            return digitCellHeight;
          }

          function digitOffset(value, current) {
            var offset = (value - current + 10) % 10;
            if (offset > 5) offset -= 10;
            return offset;
          }

          function digitTranslatePx(value, digit, cellHeight) {
            return digitOffset(value, Number(digit)) * cellHeight;
          }

          function positionDigit(track, digit, instant, previousDigit) {
            var cellHeight = refreshCellHeight();
            if (!cellHeight) return;
            var previous = previousDigit === undefined ? digit : previousDigit;
            cancelAnimations(track);
            var nodes = track.querySelectorAll(".digit__num");
            for (var index = 0; index < nodes.length; index += 1) {
              var node = nodes[index];
              var value = Number(node.dataset.num);
              var fromY = digitTranslatePx(value, previous, cellHeight);
              var toY = digitTranslatePx(value, digit, cellHeight);

              cancelAnimations(node);
              if (instant || typeof node.animate !== "function") {
                node.style.transform = "translate3d(0, " + toY + "px, 0)";
                continue;
              }

              node.style.transform = "translate3d(0, " + toY + "px, 0)";
              node.animate([
                { transform: "translate3d(0, " + fromY + "px, 0)" },
                { transform: "translate3d(0, " + toY + "px, 0)" }
              ], { duration: ANIM_MS, easing: ANIM_EASE, fill: "both" });
            }
          }

          function setAllInstant(text) {
            if (currentTemplate !== priceTemplate(text) || !element.children.length) {
              buildOdometer(text);
              refreshCellHeight();
            }

            var nodes = element.children;
            var index = 0;
            for (var characterIndex = 0; characterIndex < text.length; characterIndex += 1) {
              var character = text.charAt(characterIndex);
              var node = nodes[index++];
              if (!node) break;
              if (node.classList.contains("digit")) {
                node.dataset.value = character;
                positionDigit(node.querySelector(".track"), character, true);
              } else {
                node.textContent = character;
              }
            }

            currentTemplate = priceTemplate(text);
            lastShown = text;
            inited = true;
          }

          function animateTo(text) {
            if (!inited || priceTemplate(text) !== currentTemplate) {
              setAllInstant(text);
              return;
            }

            var nodes = element.children;
            var index = 0;
            for (var characterIndex = 0; characterIndex < text.length; characterIndex += 1) {
              var character = text.charAt(characterIndex);
              var node = nodes[index++];
              if (!node) break;
              if (node.classList.contains("digit")) {
                if (node.dataset.value !== character) {
                  var previous = node.dataset.value;
                  node.dataset.value = character;
                  positionDigit(node.querySelector(".track"), character, false, previous);
                }
              } else if (node.textContent !== character) {
                node.textContent = character;
              }
            }

            currentTemplate = priceTemplate(text);
            lastShown = text;
          }

          function setPrice(value, instant) {
            var text = formatPriceText(value);
            if (!text) return;
            var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (instant || reducedMotion || !inited || priceTemplate(text) !== currentTemplate) {
              setAllInstant(text);
            } else if (text !== lastShown) {
              animateTo(text);
            }
          }

          function refitCurrent() {
            if (!inited || !lastShown) return;
            refreshCellHeight();
            setAllInstant(lastShown);
          }

          return { setPrice: setPrice, refitCurrent: refitCurrent };
        }

        function createMarketRow(item) {
          var row = document.createElement("div");
          row.className = "market-row market-row--" + item.id;

          var ident = document.createElement("div");
          ident.className = "market-ident";
          var symbol = document.createElement("strong");
          symbol.className = "market-symbol";
          var staleDot = document.createElement("span");
          staleDot.className = "market-stale-dot";
          staleDot.setAttribute("aria-hidden", "true");

        function connectSocket(url, handlers) {
          var socket = null;
          var stopped = false;
          var attempt = 0;
          var pingTimer = 0;
          var retryTimer = 0;

          function clearPing() {
            if (pingTimer) {
              window.clearInterval(pingTimer);
              pingTimer = 0;
            }
          }

          function open() {
            if (stopped) return;
            try {
              socket = new WebSocket(url);
            } catch (error) {
              retry();
              return;
            }
            socket.onopen = function () {
              attempt = 0;
              if (handlers.onOpen) handlers.onOpen(socket);
              if (handlers.ping) {
                pingTimer = window.setInterval(function () {
                  if (socket && socket.readyState === 1) handlers.ping(socket);
                }, handlers.pingMs || 20000);
              }
            };
            socket.onmessage = function (event) {
              if (handlers.onMessage) handlers.onMessage(event.data);
            };
            socket.onclose = function () {
              clearPing();
              if (handlers.onDisconnect) handlers.onDisconnect();
              retry();
            };
            socket.onerror = function () {
              try { socket.close(); } catch (error) {}
            };
          }

          function retry() {
            if (stopped) return;
            var delay = Math.min(15000, 500 * Math.pow(2, attempt));
            attempt += 1;
            retryTimer = window.setTimeout(open, delay);
          }

          open();
          return {
            close: function () {
              stopped = true;
              window.clearTimeout(retryTimer);
              clearPing();
              try { if (socket) socket.close(); } catch (error) {}
            }
          };
        }

            return fetchDexScreenerMacro(macroDefinitions.filter(function (definition) { return definition.id === "stonk"; })).then(function (items) {
              if (!items.length) throw new Error("STONK price unavailable");
              return items[0];
            });
          }).then(function (item) {
            ingestQuote("stonk", Object.assign({}, item, { status: "LIVE", stale: false }));
          }).catch(function () {
            if (cachedState && cachedState.macro) {
              var cached = (cachedState.macro || []).filter(function (item) { return item && item.id === "stonk"; })[0];
              if (cached) ingestQuote("stonk", Object.assign({}, cached, { status: "STALE", stale: true }));
            }
          }).then(function () { stonkRequest = false; }, function () { stonkRequest = false; });
        }

        function watchdog() {
          var now = Date.now();
          if (btcPrimaryLive && now - btcLastWsAt > BTC_STALE_MS) {
            btcPrimaryLive = false;
            fetchBtc();
          }
          if (hlPrimaryLive && now - hlLastWsAt > HL_STALE_MS) {
            hlPrimaryLive = false;
            fetchHyperliquidMacroAll(false);
          }
          markStaleAssets();
          scheduleFlush();
        }

        function refreshAll() {
          fetchBtc();
          fetchBtcStats();
          fetchEma200();
          fetchHyperliquidMacroAll(hlPrimaryLive);
          fetchStonk();
        }

        startBtcSockets();
        startHyperliquidSocket();
        refreshAll();
        window.setInterval(fetchBtcStats, STATS_INTERVAL);
        window.setInterval(fetchEma200, EMA_INTERVAL);
        window.setInterval(fetchStonk, STONK_INTERVAL);
        window.setInterval(function () {
          if (!btcPrimaryLive) fetchBtc();
          if (!hlPrimaryLive) fetchHyperliquidMacroAll(false);
        }, REST_FALLBACK_MS);
        window.setInterval(function () { fetchHyperliquidMacroAll(true); }, STATS_INTERVAL);
        window.setInterval(watchdog, 1000);
        window.addEventListener("focus", refreshAll, { passive: true });
        window.addEventListener("pageshow", function () {
          refreshAll();
          refitAllPrices();
        }, { passive: true });
        window.addEventListener("orientationchange", refitAllPrices, { passive: true });
        window.addEventListener("resize", refitAllPrices, { passive: true });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitAllPrices).catch(function () {});
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") refreshAll();
        });
      }());
    </script>
  </body>
</html>
