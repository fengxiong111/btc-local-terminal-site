    <style>
      :root {
        color-scheme: light;
        --bg: #eef2ee;
        --surface: #f8faf7;
        --surface-strong: #ffffff;
        --text: #202925;

        --strong: #2d3933;
        --up: #147c5b;
        --down: #b6535c;
        --pending: #a4773c;
        --shadow-card: 0 16px 32px rgba(43, 61, 50, 0.09), 0 3px 8px rgba(43, 61, 50, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.88);
        --radius-card: 16px;
      }

      * { box-sizing: border-box; }

      html {
        min-width: 0;
        min-height: 100%;
        background: var(--bg);
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-x: none;
      }

      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.95), transparent 35%),
          radial-gradient(circle at 96% 10%, rgba(214, 229, 218, 0.54), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a { color: inherit; }

      .skip-link {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--strong);
        color: var(--surface-strong);
        text-decoration: none;
        transform: translateY(-150%);
        transition: transform 160ms ease;
      }

      .skip-link:focus { transform: translateY(0); }

      .page {
        --space: 16px;
        width: 100%; min-height: 100vh; min-height: 100svh;
        padding: max(var(--space), env(safe-area-inset-top)) max(var(--space), env(safe-area-inset-right)) max(var(--space), env(safe-area-inset-bottom)) max(var(--space), env(safe-area-inset-left));
        display: flex; flex-direction: column;
      }
      @media (max-width: 560px) { .page { --space: 8px; } }

      .market-row,
      .market-ident,
      .market-quote {
        display: flex;
      }

      :focus-visible {
        outline: 2px solid var(--strong);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .market-section { display: flex; flex: 1 1 auto; min-height: 0; }
      .market-list { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(var(--columns, 2), minmax(0, 1fr)); grid-auto-rows: minmax(130px, 1fr); gap: var(--space); }
      .market-row { container-type: size; min-width: 0; min-height: 130px; flex-direction: column; align-items: stretch; justify-content: space-between; gap: clamp(8px, 2cqh, 24px); padding: clamp(12px, min(4cqw, 5cqh), 48px); border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }

      .market-row[data-market-state="stale"],
      .market-row[data-market-state="fallback"] { opacity: 0.84; }
      .market-ident { width: 100%; min-width: 0; flex: 0 0 auto; flex-direction: row; align-items: center; gap: 7px; }
      .market-symbol { color: var(--strong); font-size: clamp(16px, min(7cqw, 11cqh), 86px); font-weight: 600; line-height: 1.2; letter-spacing: -0.35px; }
      .market-cap { min-width: 0; margin-left: auto; color: var(--muted); font-size: clamp(12px, min(4.5cqw, 7cqh), 52px); font-weight: 500; line-height: 1.2; letter-spacing: 0; white-space: nowrap; }
      .market-stale-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pending); opacity: 0; flex: 0 0 auto; }
      .market-row[data-market-state="stale"] .market-stale-dot,
      .market-row[data-market-state="fallback"] .market-stale-dot { opacity: 0.9; }
      .market-source { display: none; }
      .market-quote { width: 100%; min-width: 0; flex: 1 1 auto; flex-direction: column; align-items: flex-start; justify-content: center; gap: clamp(8px, 2cqh, 24px); }
      .market-price { display: inline-flex; min-width: 0; flex: 0 1 auto; align-items: baseline; justify-content: flex-start; gap: 0; overflow: visible; color: var(--text); font-size: clamp(28px, min(var(--price-cqw, 18cqw), 34cqh), 240px); font-weight: 600; line-height: 1; letter-spacing: -0.04em; white-space: nowrap; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "lnum" 1; }
      .market-price .digit { position: relative; display: inline-block; width: 0.70em; height: 1em; line-height: 1em; overflow: hidden; vertical-align: baseline; padding: 0 0.02em; box-sizing: content-box; }
      .market-price .sep { display: inline-block; width: 0.22em; margin: 0 -0.04em; text-align: center; opacity: 0.86; }
      .market-price .track { position: absolute; inset: 0; }
      .market-price .digit__num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-right: 0.03em; box-sizing: border-box; }
      .market-change { min-width: 0; color: var(--muted); font-size: clamp(13px, min(5cqw, 8cqh), 60px); line-height: 1.2; text-align: right; white-space: nowrap; }
      .market-change.is-empty { display: none; }
      .market-change.up { color: var(--up); }
      .market-change.down { color: var(--down); }

      .btc-cap-group { display: flex; margin-left: auto; flex-direction: column; align-items: flex-end; gap: 3px; }
      .btc-metric { display: flex; align-items: baseline; gap: 4px; color: var(--muted); font-size: clamp(12px, min(4.5cqw, 7cqh), 52px); line-height: 1.2; white-space: nowrap; }
      .btc-metric .market-symbol, .btc-metric .market-price { color: inherit; font-size: inherit; font-weight: 500; letter-spacing: 0; }
      .btc-metric[data-market-state="stale"] { opacity: 0.7; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
    </style>
  </head>

          { id: "googl", label: "GOOGL", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "GOOGLUSDT" }
        ];
        var marketDefinitions = [{ id: "btc", label: "BTC", source: "okx" }].concat([
          { id: "ema200", label: "EMA200", source: "btc-daily" }
        ], macroDefinitions, macroDefinitions.map(function (definition) {
          return { id: "ema200_" + definition.id, label: "EMA200", source: "hyperliquid-daily" };
        }));

        function formatCompactMarketCap(value) {
          var number = finite(value);
          if (number === null || number < 0) return "";
          var divisor = 1;
          var suffix = "";
          if (number >= 1e12) { divisor = 1e12; suffix = "T"; }
          else if (number >= 1e9) { divisor = 1e9; suffix = "B"; }
          else if (number >= 1e6) { divisor = 1e6; suffix = "M"; }
          else if (number >= 1e3) { divisor = 1e3; suffix = "K"; }
          var scaled = number / divisor;
          var digits = scaled >= 100 ? 0 : (scaled >= 10 ? 1 : 2);
          var formatted = scaled.toFixed(digits);
          if (digits > 0) formatted = formatted.replace(/0+$/, "").replace(/\.$/, "");
          return formatted + suffix;
        }

        function marketCapText(item) {
          var liveValue = finite(item && item.marketCap);
          var fallbackValue = item && MARKET_CAP_BY_ID[item.id];
          return formatCompactMarketCap(liveValue !== null ? liveValue : fallbackValue);
        }

        if (cachedState) {
          if (cachedState.btc) renderBtc(cachedState.btc, true);
          if (finite(cachedState.ema200) !== null) renderEma200(cachedState.ema200, true);
          if (cachedState.macro) renderMacro(cachedState.macro, true);
          if (cachedState.stockEma) Object.keys(cachedState.stockEma).forEach(function (id) { renderStockEma(id, cachedState.stockEma[id], true); });
        }

        function finite(value) {
          if (value === null || value === undefined || value === "") return null;
          var number = Number(value);
          return isFinite(number) ? number : null;
        }

        function numberText(value, fraction) {
          var number = finite(value);
          if (number === null) return "";
          try {
            return new Intl.NumberFormat("en-US", {
              minimumFractionDigits: fraction,
              maximumFractionDigits: fraction
            }).format(number);
          } catch (error) {
            return number.toFixed(fraction);
          }
        }

        function pctText(value, fraction) {
          var number = finite(value);
          if (number === null) return "";
          var digits = typeof fraction === "number" ? fraction : 2;
          return (number >= 0 ? "+" : "") + number.toFixed(digits) + "%";
        }

        function requestJson(url, timeout, requestOptions) {
          if (window.fetch) {
            var controller = typeof AbortController === "function" ? new AbortController() : null;

        function readCache() {
          try {
            window.localStorage.removeItem("btc-local-terminal-public-v7");
            var value = window.localStorage.getItem(CACHE_KEY);
            if (!value) return null;
            var parsed = JSON.parse(value);
            return parsed && parsed.savedAt ? parsed : null;
          } catch (error) {
            return null;

        }

        function sourceMeta(symbol, fallback) {
          var value = typeof symbol === "string" ? symbol : "";

          if (value.indexOf("OKX:") === 0) return "okx";
          if (value.indexOf("BINANCE:") === 0 || value.indexOf("BINANCE-") === 0) return "binance";
          return fallback || "public";
        }

        function priceFraction(value) {
          var price = finite(value);
          return price !== null && price >= 1 ? 0 : 2;
        }

        function formatPriceText(value) {

        function normalizedChange(item) {

        function replaceChildrenCompat(element, child) {

        function staleLimit(id) {

          if (id === "ema200" || id.indexOf("ema200_") === 0) return EMA_STALE_MS;

        function lookupMid(mids, label, dex) {
          if (!mids) return null;
          var keys = dex ? [dex + ":" + label, label, label + "USDT"] : [label];
          for (var index = 0; index < keys.length; index += 1) {

        function createPriceOdometer(element) {
          var instanceId = odometerInstanceSequence += 1;
          var currentTemplate = "";
          var lastShown = "";
          var inited = false;
          var digitCellHeight = 0;
          diagnostics.odometerInstancesCreated += 1;

          function cancelAnimations(node) {
            node.getAnimations().forEach(function (animation) {
              diagnostics.animationCancelCount += 1;
              animation.cancel();
            });
          }

          function buildOdometer(text) {
            diagnostics.odometerBuildCount += 1;
            element.innerHTML = "";
            for (var index = 0; index < text.length; index += 1) {
              var character = text.charAt(index);
              if (character >= "0" && character <= "9") {
                var digit = document.createElement("span");
                digit.className = "digit";
                digit.dataset.value = character;

                var track = document.createElement("span");
                track.className = "track";

                for (var number = 0; number <= 9; number += 1) {
                  var cell = document.createElement("span");
                  cell.className = "digit__num";
                  cell.textContent = String(number);
                  cell.dataset.num = String(number);
                  track.appendChild(cell);
                }

                digit.appendChild(track);
                element.appendChild(digit);
              } else {
                var separator = document.createElement("span");
                separator.className = "sep";
                separator.textContent = character;
                element.appendChild(separator);
              }
            }
          }

          function refreshCellHeight() {
            var digit = element.querySelector(".digit");

            cancelAnimations(track);
            var nodes = track.querySelectorAll(".digit__num");
            for (var index = 0; index < nodes.length; index += 1) {
              var node = nodes[index];
              var value = Number(node.dataset.num);
              var fromY = digitTranslatePx(value, previous, cellHeight);
              var toY = digitTranslatePx(value, digit, cellHeight);

        function createMarketRow(item) {

          var best = 1, bestScore = Infinity;

        function connectSocket(url, handlers) {
          var socket = null;
          var stopped = false;
          var attempt = 0;
          var pingTimer = 0;
          var retryTimer = 0;
          var label = socketLabel(url);

          function setSocketState(state) {
            diagnostics.socketStates[label] = state;
            diagnostics.lastSocketStateAt = Date.now();
          }

          function clearPing() {
            if (pingTimer) {
              window.clearInterval(pingTimer);
              pingTimer = 0;
            }
          }

          function open() {
            if (stopped) return;
            setSocketState("CONNECTING");
            try {
              socket = new WebSocket(url);
            } catch (error) {
              setSocketState("UNAVAILABLE");
              retry();
              return;
            }
            socket.onopen = function () {
              attempt = 0;
              setSocketState("OPEN");
              if (handlers.onOpen) handlers.onOpen(socket);
              if (handlers.ping) {
                pingTimer = window.setInterval(function () {
                  if (socket && socket.readyState === 1) handlers.ping(socket);
                }, handlers.pingMs || 20000);
              }
            };
            socket.onmessage = function (event) {
              if (handlers.onMessage) handlers.onMessage(event.data);
            };
            socket.onclose = function () {
              clearPing();
              setSocketState("CLOSED_RETRYING");
              if (handlers.onDisconnect) handlers.onDisconnect();
              retry();
            };
            socket.onerror = function () {
              setSocketState("ERROR");
              try { socket.close(); } catch (error) {}
            };
          }

          function retry() {
            if (stopped) return;
            var delay = Math.min(15000, 500 * Math.pow(2, attempt));
            attempt += 1;
            retryTimer = window.setTimeout(open, delay);
          }

          open();
          return {
            close: function () {
              stopped = true;
              window.clearTimeout(retryTimer);
              clearPing();
              try { if (socket) socket.close(); } catch (error) {}
            }
          };
        }

          var hypeDefinitions = macroDefinitions.filter(function (definition) { return definition.source === "hyperliquid" && !definition.dex; });
          var stockDefinitions = macroDefinitions.filter(function (definition) { return definition.dex === HIP3_STOCK_DEX; });
          Promise.all([
            fetchHyperliquidMacro(hypeDefinitions).catch(function () { return []; }),
            fetchHyperliquidMacro(stockDefinitions, HIP3_STOCK_DEX).catch(function () { return []; })
          ]).then(function (groups) {
            var items = groups[0].concat(groups[1]);
            applyMacroItems(items, !hlPrimaryLive);
          }).then(function () { macroRequest = false; }, function () { macroRequest = false; });
        }

        function watchdog() {
          var now = Date.now();
          if (btcPrimaryLive && now - btcLastWsAt > BTC_STALE_MS) {
            btcPrimaryLive = false;
            fetchBtc();
          }
          if (hlPrimaryLive && now - hlLastWsAt > HL_STALE_MS) {
            hlPrimaryLive = false;
            fetchHyperliquidMacroAll(false);
          }
          markStaleAssets();
          scheduleFlush();
        }

        function refreshAll() {
          fetchBtc();
          fetchBtcStats();
          fetchEma200();
          fetchStockEma200();
          fetchHyperliquidMacroAll(hlPrimaryLive);
        }

        startBtcSockets();
        startHyperliquidSocket();
        refreshAll();
        window.setInterval(fetchBtcStats, STATS_INTERVAL);
        window.setInterval(fetchEma200, EMA_INTERVAL);
        window.setInterval(fetchStockEma200, EMA_INTERVAL);
        window.setInterval(function () {
          if (!btcPrimaryLive) fetchBtc();
          if (!hlPrimaryLive) fetchHyperliquidMacroAll(false);
        }, REST_FALLBACK_MS);
        window.setInterval(function () { fetchHyperliquidMacroAll(true); }, STATS_INTERVAL);
        window.setInterval(watchdog, 1000);
        window.addEventListener("focus", refreshAll, { passive: true });
        window.addEventListener("pageshow", function () {
          refreshAll();
          refitAllPrices("pageshow");
        }, { passive: true });
        window.addEventListener("orientationchange", function () { refitAllPrices("orientationchange"); }, { passive: true });
        window.addEventListener("resize", function () { updateGrid(); refitAllPrices("resize"); }, { passive: true });
        if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { refitAllPrices("visualViewport"); }, { passive: true });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { refitAllPrices("fonts-ready"); }).catch(function () {});
        if (document.fonts && typeof document.fonts.addEventListener === "function") document.fonts.addEventListener("loadingdone", function () { refitAllPrices("fonts-loadingdone"); });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") refreshAll();
        });
      }());
    </script>
  </body>
</html>
