<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>市场</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/JetBrainsMono-variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --bg: #eef2ee;
        --surface: #f8faf7;
        --surface-strong: #ffffff;
        --surface-muted: #e7ece8;
        --text: #202925;
        --muted: #78847d;
        --soft: #a1aaa4;
        --strong: #2d3933;
        --track: #d9e1db;
        --up: #147c5b;
        --down: #b6535c;
        --pending: #a4773c;
        --shadow-card: 0 16px 32px rgba(43, 61, 50, 0.09), 0 3px 8px rgba(43, 61, 50, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.88);
        --radius-card: 16px;
        --radius-large: 18px;
      }

      * { box-sizing: border-box; }

      html {
        min-width: 0;
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.95), transparent 35%),
          radial-gradient(circle at 96% 10%, rgba(214, 229, 218, 0.54), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", "SFMono-Regular", "PingFang SC", "Microsoft YaHei", monospace;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a { color: inherit; }
      button { font: inherit; }

      .skip-link {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--strong);
        color: var(--surface-strong);
        text-decoration: none;
        transform: translateY(-150%);
        transition: transform 160ms ease;
      }

      .skip-link:focus { transform: translateY(0); }

      .page {
        width: min(100%, 860px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(18px, calc(env(safe-area-inset-top) + 18px))
          max(16px, calc(env(safe-area-inset-right) + 16px))
          max(28px, calc(env(safe-area-inset-bottom) + 28px))
          max(16px, calc(env(safe-area-inset-left) + 16px));
      }

      .market-row,
      .market-ident,
      .market-quote {
        display: flex;
      }

      .market-source {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        line-height: 14px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      :focus-visible {
        outline: 2px solid var(--strong);
        outline-offset: 3px;
      }

      .section { margin-top: 30px; }

      .news-section { margin-top: 30px; }
      .news-stack { min-width: 0; overflow: hidden; border-radius: var(--radius-large); background: var(--surface); box-shadow: var(--shadow-card); }
      .news-item { min-width: 0; }
      .news-item + .news-item { border-top: 1px solid var(--track); }
      .news-item a { display: block; padding: 17px 18px 16px; text-decoration: none; }
      .news-item a:hover { background: rgba(255, 255, 255, 0.36); }
      .news-item a:focus-visible { border-radius: inherit; }
      .news-item-title { margin: 0; color: var(--text); font-size: 16px; font-weight: 500; line-height: 22px; letter-spacing: -0.12px; overflow-wrap: anywhere; }
      .news-item-meta { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 16px; }

      .market-section { margin-top: 14px; }
      .market-list { display: grid; min-width: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .market-row { min-width: 0; min-height: 86px; flex-direction: column; align-items: stretch; justify-content: space-between; gap: 8px; padding: 14px; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); }
      .market-ident { min-width: 0; flex: 1 1 auto; flex-direction: column; gap: 3px; }
      .market-symbol { color: var(--strong); font-size: 17px; font-weight: 600; line-height: 21px; letter-spacing: -0.35px; }
      .market-source { overflow: hidden; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.3px; text-overflow: ellipsis; white-space: nowrap; text-transform: none; }
      .market-quote { min-width: 0; align-items: baseline; justify-content: space-between; gap: 8px; }
      .market-price { min-width: 0; color: var(--text); font-size: 16px; font-weight: 600; line-height: 20px; overflow-wrap: anywhere; }
      .market-change { min-width: 0; color: var(--muted); font-size: 13px; line-height: 18px; text-align: right; white-space: nowrap; }
      .market-change.up { color: var(--up); }
      .market-change.down { color: var(--down); }

      .empty { padding: 22px 12px; color: var(--muted); font-size: 14.5px; line-height: 18px; text-align: center; }

      @media (max-width: 560px) {
        .page { padding-top: max(14px, calc(env(safe-area-inset-top) + 14px)); }
        .section { margin-top: 25px; }
        .market-section { margin-top: 10px; }
        .market-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .market-row { min-height: 76px; gap: 8px; padding: 12px; }
        .market-ident { min-width: 0; }
        .market-symbol { font-size: 16px; }
        .market-source { font-size: 9px; }
        .market-quote { gap: 6px; }
        .market-price { font-size: 15px; }
        .market-change { font-size: 12px; }
      }

      @media (orientation: landscape) and (max-height: 620px) {
        .page { padding-top: max(12px, calc(env(safe-area-inset-top) + 12px)); }
        .section { margin-top: 20px; }
        .news-section, .market-section { margin-top: 18px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#market">跳到公开行情</a>
    <main class="page">
      <section id="market" class="section market-section" aria-label="公开行情">
        <div id="market-list" class="market-list" aria-live="polite"><p class="empty">正在读取公开行情…</p></div>
      </section>

      <section id="news" class="section news-section" aria-label="市场快讯">
        <div id="news-stack" class="news-stack" aria-live="polite"><p class="empty">正在读取公开快讯…</p></div>
      </section>
    </main>
    <script>
      (function () {
        "use strict";

        var CACHE_KEY = "btc-local-terminal-public-v7";
        var HYPERLIQUID_INFO_URL = "https://api.hyperliquid.xyz/info";
        var STALE_MS = 60 * 60 * 1000;
        var PRICE_INTERVAL = 500;
        var STATS_INTERVAL = 15000;
        var MACRO_INTERVAL = 3000;
        var NEWS_INTERVAL = 20000;
        var EMA_INTERVAL = 60000;
        var EMA_PERIOD = 200;
        var EMA_CANDLE_LIMIT = 1000;
        var marketListElement = document.getElementById("market-list");
        var newsStackElement = document.getElementById("news-stack");
        var priceRequest = false;
        var statsRequest = false;
        var macroRequest = false;
        var newsRequest = false;
        var emaRequest = false;
        var marketItemsById = {};
        var macroItemsById = {};
        var lastMarketMarkup = "";
        var HIP3_STOCK_DEX = "xyz";
        var STONK_SOLANA_ADDRESS = "6GmAFSYs4gk3FDao5FzzySQpPZaWsa4rUJHacpMpUNgx";
        var macroDefinitions = [
          { id: "hype", label: "HYPE", source: "hyperliquid" },
          { id: "pons", label: "PONS", source: "hyperliquid" },
          { id: "stonk", label: "STONK", source: "dexscreener", address: STONK_SOLANA_ADDRESS },
          { id: "spcx", label: "SPCX", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "SPCXUSDT" },
          { id: "mu", label: "MU", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "MUUSDT" },
          { id: "sndk", label: "SNDK", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "SNDKUSDT" },
          { id: "nvda", label: "NVDA", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "NVDAUSDT" }
        ];
        var marketDefinitions = [{ id: "btc", label: "BTC", source: "binance" }].concat(macroDefinitions, [
          { id: "ema200", label: "EMA200", source: "BTC daily" },
          { id: "ma120", label: "MA120", source: "BTC daily" }
        ]);
        var cachedState = readCache();

        if (/kindle|silk|kftt|kfot|kfjw|kfsowi|kfarwi|kfapwi|kfmawi/i.test(navigator.userAgent || "")) {
          document.documentElement.className = "kindle";
        }

        if (cachedState) {
          if (cachedState.btc) renderBtc(cachedState.btc);
          if (finite(cachedState.ema200) !== null) renderEma200(cachedState.ema200, cachedState.ma120);
          if (cachedState.macro) renderMacro(cachedState.macro);
          if (cachedState.news) renderNews(cachedState.news);
        }

        function finite(value) {
          if (value === null || value === undefined || value === "") return null;
          var number = Number(value);
          return isFinite(number) ? number : null;
        }

        function numberText(value, fraction) {
          var number = finite(value);
          if (number === null) return "—";
          try {
            return new Intl.NumberFormat("en-US", {
              minimumFractionDigits: fraction,
              maximumFractionDigits: fraction
            }).format(number);
          } catch (error) {
            return number.toFixed(fraction);
          }
        }

        function pctText(value, fraction) {
          var number = finite(value);
          if (number === null) return "—";
          var digits = typeof fraction === "number" ? fraction : 2;
          return (number >= 0 ? "+" : "") + number.toFixed(digits) + "%";
        }

        function requestJson(url, timeout, requestOptions) {
          if (window.fetch) {
            var controller = typeof AbortController === "function" ? new AbortController() : null;
            var timer = window.setTimeout(function () { if (controller) controller.abort(); }, timeout || 8000);
            var options = { cache: "no-store", mode: "cors" };
            if (requestOptions) {
              Object.keys(requestOptions).forEach(function (key) { options[key] = requestOptions[key]; });
            }
            if (controller) options.signal = controller.signal;
            var clearTimer = function () { window.clearTimeout(timer); };
            return window.fetch(url, options).then(function (response) {
              if (!response.ok) throw new Error("HTTP " + response.status);
              return response.json();
            }).then(function (value) {
              clearTimer();
              return value;
            }, function (error) {
              clearTimer();
              throw error;
            });
          }

          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            var method = requestOptions && requestOptions.method ? requestOptions.method : "GET";
            xhr.open(method, url, true);
            xhr.timeout = timeout || 8000;
            if (requestOptions && requestOptions.headers) {
              Object.keys(requestOptions.headers).forEach(function (key) { xhr.setRequestHeader(key, requestOptions.headers[key]); });
            }
            xhr.onreadystatechange = function () {
              if (xhr.readyState !== 4) return;
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); } catch (error) { reject(error); }
              } else reject(new Error("HTTP " + xhr.status));
            };
            xhr.onerror = reject;
            xhr.ontimeout = function () { reject(new Error("timeout")); };
            xhr.send(requestOptions && requestOptions.body ? requestOptions.body : null);
          });
        }

        function readCache() {
          try {
            var value = window.localStorage.getItem(CACHE_KEY);
            if (!value) return null;
            var parsed = JSON.parse(value);
            if (!parsed || !parsed.savedAt || Date.now() - parsed.savedAt > STALE_MS) return parsed;
            return parsed;
          } catch (error) {
            return null;
          }
        }

        function writeCache() {
          try {
            window.localStorage.setItem(CACHE_KEY, JSON.stringify({
              savedAt: Date.now(),
              btc: cachedState && cachedState.btc,
              macro: cachedState && cachedState.macro,
              ema200: cachedState && cachedState.ema200,
              ma120: cachedState && cachedState.ma120,
              news: cachedState && cachedState.news
            }));
          } catch (error) {
            // Private browsing or a restricted Kindle browser may disable storage.
          }
        }

        function formatClock(value) {
          var date = value instanceof Date ? value : new Date(value);
          if (!isFinite(date.getTime())) return "—";
          try {
            return new Intl.DateTimeFormat("zh-CN", {
              timeZone: "Asia/Shanghai",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false
            }).format(date);
          } catch (error) {
            return String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
          }
        }

        function parseNewsDate(value) {
          if (typeof value !== "string" || !value.trim()) return null;
          var timestamp = Date.parse(value);
          var now = Date.now();
          if (!isFinite(timestamp) || timestamp < Date.UTC(2000, 0, 1) || timestamp > now + 24 * 60 * 60 * 1000) return null;
          return new Date(timestamp);
        }

        function formatNewsDate(date) {
          if (!(date instanceof Date) || !isFinite(date.getTime())) return "";
          try {
            return new Intl.DateTimeFormat("zh-CN", {
              timeZone: "Asia/Shanghai",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false
            }).format(date);
          } catch (error) {
            return String(date.getMonth() + 1).padStart(2, "0") + "/" + String(date.getDate()).padStart(2, "0") + " " + formatClock(date);
          }
        }

        function formatNewsAge(date) {
          if (!(date instanceof Date) || !isFinite(date.getTime())) return "";
          var diff = Date.now() - date.getTime();
          if (diff < 0 || diff > 30 * 24 * 60 * 60 * 1000) return formatNewsDate(date);
          var minutes = Math.floor(diff / 60000);
          if (minutes < 1) return "刚刚";
          if (minutes < 60) return minutes + " 分钟前";
          var hours = Math.floor(minutes / 60);
          if (hours < 24) return hours + " 小时前";
          return Math.floor(hours / 24) + " 天前";
        }

        function sourceLabel(symbol, fallback) {
          var value = typeof symbol === "string" ? symbol : "";
          if (value.indexOf("HYPERLIQUID:") === 0) return "Hyperliquid";
          if (value.indexOf("DEXSCREENER:") === 0) return "DexScreener · Solana";
          if (value.indexOf("BINANCE:") === 0 || value.indexOf("BINANCE-") === 0) return "Binance";
          return fallback || "公开数据";
        }

        function priceFraction(value) {
          var price = finite(value);
          if (price === null) return 2;
          if (price >= 1000) return 0;
          if (price >= 10) return 2;
          if (price >= 1) return 3;
          if (price >= 0.01) return 4;
          return 6;
        }

        function normalizedChange(item) {
          if (!item) return null;
          return finite(item.change !== undefined ? item.change : item.change24h);
        }

        function replaceChildrenCompat(element, child) {
          while (element.firstChild) element.removeChild(element.firstChild);
          element.appendChild(child);
        }

        function renderMarketBoard() {
          if (!marketListElement) return;
          var validItems = marketDefinitions.map(function (definition) {
            return marketItemsById[definition.id];
          }).filter(function (item) {
            return item && finite(item.price) !== null;
          });
          var marketKey = validItems.map(function (item) {
            return [item.id, item.price, normalizedChange(item), item.symbol].join(":");
          }).join("|");
          if (marketKey === lastMarketMarkup) return;
          lastMarketMarkup = marketKey;
          if (!validItems.length) {
            var empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "正在读取公开行情…";
            replaceChildrenCompat(marketListElement, empty);
            return;
          }
          var fragment = document.createDocumentFragment();
          validItems.forEach(function (item) {
            var price = finite(item.price);
            var change = normalizedChange(item);
            var row = document.createElement("div");
            row.className = "market-row";
            row.setAttribute("data-market-id", item.id);

            var ident = document.createElement("div");
            ident.className = "market-ident";
            var symbol = document.createElement("strong");
            symbol.className = "market-symbol";
            symbol.textContent = item.label || item.id.toUpperCase();
            var source = document.createElement("span");
            source.className = "market-source";
            source.textContent = sourceLabel(item.symbol, item.source);
            ident.append(symbol, source);

            var quote = document.createElement("div");
            quote.className = "market-quote";
            var priceElement = document.createElement("span");
            priceElement.className = "market-price";
            priceElement.textContent = numberText(price, priceFraction(price));
            var changeElement = document.createElement("span");
            changeElement.className = "market-change";
            changeElement.textContent = change === null ? "—" : pctText(change);
            if (change !== null) changeElement.classList.add(change >= 0 ? "up" : "down");
            quote.append(priceElement, changeElement);
            row.append(ident, quote);
            fragment.append(row);
          });
          replaceChildrenCompat(marketListElement, fragment);
        }

        function renderEma200(value, ma120) {
          var ema = finite(value);
          var ma = finite(ma120);
          cachedState = cachedState || {};
          if (ema !== null) {
            cachedState.ema200 = ema;
            marketItemsById.ema200 = { id: "ema200", label: "EMA200", source: "BTC daily", symbol: "BTC-1D", price: ema, change: null };
          }
          if (ma !== null) {
            cachedState.ma120 = ma;
            marketItemsById.ma120 = { id: "ma120", label: "MA120", source: "BTC daily", symbol: "BTC-1D", price: ma, change: null };
          }
          if (ema !== null || ma !== null) renderMarketBoard();
        }

        function fetchEma200() {
          if (emaRequest) return;
          emaRequest = true;
          requestJson("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=" + EMA_CANDLE_LIMIT, 8000).then(function (candles) {
            var closes = (Array.isArray(candles) ? candles : []).map(function (item) { return finite(item && item[4]); }).filter(function (value) { return value !== null && value > 0; });
            if (closes.length < EMA_PERIOD || closes.length < 120) throw new Error("Binance 日线数据不足");
            var sum = 0;
            for (var index = 0; index < EMA_PERIOD; index += 1) sum += closes[index];
            var ema = sum / EMA_PERIOD;
            var multiplier = 2 / (EMA_PERIOD + 1);
            for (var next = EMA_PERIOD; next < closes.length; next += 1) ema = (closes[next] - ema) * multiplier + ema;
            var maStart = closes.length - 120;
            var maSum = 0;
            for (var maIndex = maStart; maIndex < closes.length; maIndex += 1) maSum += closes[maIndex];
            renderEma200(ema, maSum / 120);
            writeCache();
          }).catch(function () {
            if (cachedState && finite(cachedState.ema200) !== null) renderEma200(cachedState.ema200, cachedState.ma120);
          }).then(function () { emaRequest = false; }, function () { emaRequest = false; });
        }

        function renderBtc(btc) {
          var previous = cachedState && cachedState.btc ? cachedState.btc : {};
          var nextBtc = Object.assign({}, previous, btc);
          var price = finite(btc.price);
          if (price !== null) {
            marketItemsById.btc = {
              id: "btc",
              label: "BTC",
              source: "binance",
              symbol: "BINANCE:BTCUSDT",
              price: price,
              change: finite(btc.change)
            };
            renderMarketBoard();
          }
          cachedState = cachedState || {};
          cachedState.btc = nextBtc;
        }

        function renderMacro(items) {
          (items || []).forEach(function (item) {
            if (!item || finite(item.price) === null) return;
            macroItemsById[item.id] = Object.assign({}, macroItemsById[item.id] || {}, item);
            marketItemsById[item.id] = macroItemsById[item.id];
          });
          var validItems = macroDefinitions.map(function (definition) { return macroItemsById[definition.id]; }).filter(function (item) { return item && finite(item.price) !== null; });
          cachedState = cachedState || {};
          cachedState.macro = validItems;
          if (validItems.length) {
            renderMarketBoard();
          }
        }

        function cleanTitle(value) {
          if (typeof value !== "string") return null;
          var title = value.replace(/^观点[:：]\s*/, "").replace(/\s+/g, " ").trim();
          return title.length > 0 ? title : null;
        }

        function safeHref(value) {
          var raw = typeof value === "string" && value ? value : "https://fengxiong111.github.io/lydong-screen/";
          return /^https?:\/\//i.test(raw) ? raw : "https://fengxiong111.github.io/lydong-screen/";
        }

        function normalizedNewsItem(item) {
          var title = cleanTitle(item && item.title);
          var rawDate = item && (item.ts || item.time || item.date);
          var date = parseNewsDate(rawDate);
          if (!title || !date) return null;
          return {
            id: item.id || title,
            title: title,
            ts: typeof rawDate === "string" ? rawDate : date.toISOString(),
            url: safeHref(item.url),
            date: date
          };
        }

        function createNewsItem(item) {
          var article = document.createElement("article");
          article.className = "news-item";
          var link = document.createElement("a");
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noreferrer";
          var title = document.createElement("h3");
          title.className = "news-item-title";
          title.textContent = item.title;
          var time = document.createElement("time");
          time.className = "news-item-meta";
          time.dateTime = item.date.toISOString();
          time.textContent = formatNewsAge(item.date);
          link.append(title, time);
          article.append(link);
          return article;
        }

        function renderNews(items) {
          var validItems = (items || []).map(normalizedNewsItem).filter(function (item) { return item !== null; }).sort(function (left, right) {
            return right.date.getTime() - left.date.getTime();
          }).slice(0, 12);
          if (!newsStackElement) return;
          var fragment = document.createDocumentFragment();
          if (!validItems.length) {
            var empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "暂无可用快讯";
            fragment.append(empty);
          } else {
            validItems.forEach(function (item) { fragment.append(createNewsItem(item)); });
          }
          replaceChildrenCompat(newsStackElement, fragment);
          cachedState = cachedState || {};
          cachedState.news = validItems.map(function (item) {
            return { id: item.id, title: item.title, ts: item.ts, url: item.url };
          });
        }

        function fetchBtc() {
          if (priceRequest) return;
          priceRequest = true;
          var fallback = requestJson("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT", 2500).then(function (ticker) {
            var price = finite(ticker.price);
            if (price === null) throw new Error("Binance BTC price unavailable");
            return { price: price };
          }).catch(function () {
            return requestJson(HYPERLIQUID_INFO_URL, 2500, {
              method: "POST",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify({ type: "allMids" })
            }).then(function (mids) {
              var price = finite(mids && mids.BTC);
              if (price === null) throw new Error("Hyperliquid BTC price unavailable");
              return { price: price };
            });
          });
          fallback.then(function (quote) {
            var previous = cachedState && cachedState.btc ? cachedState.btc : {};
            var priceChanged = previous.price !== quote.price;
            renderBtc({ price: quote.price, change: previous.change });
            if (priceChanged) writeCache();
          }).catch(function () {
            if (cachedState && cachedState.btc) {
              renderBtc(cachedState.btc);
            }
          }).then(function () { priceRequest = false; });
        }

        function fetchBtcStats() {
          if (statsRequest) return;
          statsRequest = true;
          requestJson("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT", 3000).then(function (ticker) {
            if (!cachedState || !cachedState.btc) return;
            var change = finite(ticker.priceChangePercent);
            var changeChanged = cachedState.btc.change !== change;
            renderBtc({ price: cachedState.btc.price, change: change });
            if (changeChanged) writeCache();
          }).then(function () { statsRequest = false; }, function () { statsRequest = false; });
        }

        function fetchHyperliquidMacro(definitions, dex) {
          if (!definitions.length) return Promise.resolve([]);
          var body = { type: "metaAndAssetCtxs" };
          if (dex) body.dex = dex;
          return requestJson(HYPERLIQUID_INFO_URL, 2500, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(body)
          }).then(function (payload) {
            var meta = payload && payload[0];
            var contexts = payload && payload[1];
            var universe = meta && Array.isArray(meta.universe) ? meta.universe : [];
            return definitions.map(function (definition) {
              var expectedName = (dex ? dex + ":" : "") + definition.label;
              var index = universe.findIndex(function (item) {
                return item && (item.name === expectedName || (!dex && item.name === definition.label));
              });
              var context = Array.isArray(contexts) && index >= 0 ? contexts[index] : null;
              var price = context ? finite(context.markPx || context.midPx) : null;
              var previous = context ? finite(context.prevDayPx) : null;
              if (price === null) return null;
              var sourceName = universe[index] && typeof universe[index].name === "string" ? universe[index].name : expectedName;
              return {
                id: definition.id,
                label: definition.label,
                symbol: "HYPERLIQUID:" + sourceName,
                price: price,
                change: previous !== null && previous > 0 ? ((price - previous) / previous) * 100 : null
              };
            }).filter(function (item) { return item !== null; });
          });
        }

        function fetchBinanceMacro(definitions) {
          return Promise.all(definitions.map(function (definition) {
            return requestJson("https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=" + definition.symbol, 3000).then(function (ticker) {
              var price = finite(ticker.lastPrice);
              var change = finite(ticker.priceChangePercent);
              if (ticker.symbol !== definition.symbol || price === null) throw new Error(definition.label + " price unavailable");
              return { id: definition.id, label: definition.label, symbol: "BINANCE-FUTURES:" + definition.symbol, price: price, change: change };
            }).catch(function () { return null; });
          })).then(function (items) {
            return items.filter(function (item) { return item !== null; });
          });
        }

        function fetchDexScreenerMacro(definitions) {
          return Promise.all(definitions.map(function (definition) {
            return requestJson("https://api.dexscreener.com/latest/dex/tokens/" + definition.address, 3000).then(function (payload) {
              var pairs = payload && Array.isArray(payload.pairs) ? payload.pairs : [];
              pairs = pairs.filter(function (pair) {
                return pair && pair.chainId === "solana" && pair.baseToken && pair.baseToken.address === definition.address && finite(pair.priceUsd) !== null;
              }).sort(function (left, right) { return (right.liquidity && finite(right.liquidity.usd) || 0) - (left.liquidity && finite(left.liquidity.usd) || 0); });
              var pair = pairs[0];
              if (!pair) throw new Error(definition.label + " price unavailable");
              return {
                id: definition.id,
                label: definition.label,
                symbol: "DEXSCREENER:SOLANA:" + definition.address,
                price: finite(pair.priceUsd),
                change: pair.priceChange ? finite(pair.priceChange.h24) : null
              };
            }).catch(function () { return null; });
          })).then(function (items) {
            return items.filter(function (item) { return item !== null; });
          });
        }

        function fetchMacro() {
          if (macroRequest) return;
          macroRequest = true;
          var hypeDefinitions = macroDefinitions.filter(function (definition) { return definition.source === "hyperliquid" && !definition.dex; });
          var stockDefinitions = macroDefinitions.filter(function (definition) { return definition.dex === HIP3_STOCK_DEX; });
          var dexDefinitions = macroDefinitions.filter(function (definition) { return definition.source === "dexscreener"; });
          Promise.all([
            fetchHyperliquidMacro(hypeDefinitions).catch(function () { return []; }),
            fetchHyperliquidMacro(stockDefinitions, HIP3_STOCK_DEX).catch(function () { return []; }),
            fetchDexScreenerMacro(dexDefinitions)
          ]).then(function (groups) {
            var items = groups[0].concat(groups[1], groups[2]);
            if (items.length > 0) {
              renderMacro(items);
              writeCache();
            }
            var available = {};
            items.forEach(function (item) { available[item.id] = true; });
            var missingStocks = stockDefinitions.filter(function (definition) { return !available[definition.id]; });
            return fetchBinanceMacro(missingStocks);
          }).then(function (fallbackItems) {
            if (fallbackItems.length > 0) {
              renderMacro(fallbackItems);
              writeCache();
            }
          }).then(function () { macroRequest = false; }, function () { macroRequest = false; });
        }

        function fetchNews() {
          if (newsRequest) return;
          newsRequest = true;
          var urls = [
            "https://fengxiong111.github.io/lydong-screen/feed.json",
            "https://raw.githubusercontent.com/fengxiong111/lydong-screen/main/feed.json"
          ];
          var attempt = function (index) {
            if (index >= urls.length) return Promise.reject(new Error("news unavailable"));
            return requestJson(urls[index], 9000).catch(function () { return attempt(index + 1); });
          };
          attempt(0).then(function (items) {
            var list = Array.isArray(items) ? items : (items && Array.isArray(items.items) ? items.items : []);
            list.sort(function (a, b) { return String(b.ts || b.time || "").localeCompare(String(a.ts || a.time || "")); });
            renderNews(list);
            writeCache();
          }).catch(function () {
            if (cachedState && cachedState.news) {
              renderNews(cachedState.news);
            }
          }).then(function () { newsRequest = false; });
        }

        function refreshAll() {
          fetchBtc();
          fetchBtcStats();
          fetchEma200();
          fetchMacro();
          fetchNews();
        }

        refreshAll();
        window.setInterval(fetchBtc, PRICE_INTERVAL);
        window.setInterval(fetchBtcStats, STATS_INTERVAL);
        window.setInterval(fetchEma200, EMA_INTERVAL);
        window.setInterval(fetchMacro, MACRO_INTERVAL);
        window.setInterval(fetchNews, NEWS_INTERVAL);
        window.addEventListener("focus", refreshAll, { passive: true });
        window.addEventListener("pageshow", refreshAll, { passive: true });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") refreshAll();
        });
      }());
    </script>
  </body>
</html>
