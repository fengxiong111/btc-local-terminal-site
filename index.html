<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BTC 本地终端</title>
    <style>
      :root {
        --paper: #f5f4ed;
        --paper-deep: #ebe9df;
        --ink: #141413;
        --muted: #6b6a64;
        --faint: #86868b;
        --line: rgba(20, 20, 19, 0.08);
        --panel: rgba(255, 255, 255, 0.62);
        --up: #1faa6b;
        --down: #c75466;
        --blue-ink: #1b365d;
      }

      * { box-sizing: border-box; }

      html,
      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.92), transparent 44%),
          var(--paper);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a { color: inherit; }

      .page {
        min-height: 100svh;
        width: min(100%, 1560px);
        margin: 0 auto;
        padding: max(24px, calc(env(safe-area-inset-top) + 24px))
          max(24px, calc(env(safe-area-inset-right) + 24px))
          max(28px, calc(env(safe-area-inset-bottom) + 28px))
          max(24px, calc(env(safe-area-inset-left) + 24px));
      }

      .island {
        position: relative;
        display: flex;
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 24px 32px 26px;
        flex-direction: column;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 40px;
        background: var(--panel);
        box-shadow: 0 18px 46px rgba(42, 39, 30, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .island-topline {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 16px;
        min-height: 24px;
      }

      .asset-mark {
        color: var(--blue-ink);
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.2em;
      }

      .connection-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--up);
        box-shadow: 0 0 0 3px rgba(31, 170, 107, 0.12), 0 0 8px rgba(31, 170, 107, 0.28);
        animation: dot-breathe 2.4s ease-in-out infinite;
      }

      .change {
        font-size: clamp(19px, 1.55vw, 28px);
        font-weight: 700;
        line-height: 1;
      }

      .up { color: var(--up); }
      .down { color: var(--down); }

      .price {
        margin-top: 6px;
        color: var(--ink);
        font-size: clamp(72px, 9.2vw, 138px);
        font-weight: 680;
        line-height: 0.92;
        letter-spacing: -0.045em;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        transition: opacity 0.2s ease;
      }

      .price-pulse { animation: price-pulse 260ms ease-out; }

      .benchmark {
        display: flex;
        width: min(100%, 320px);
        margin: 18px auto 0;
        padding-top: 12px;
        align-items: baseline;
        justify-content: center;
        gap: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }

      .benchmark strong {
        color: var(--ink);
        font-size: 20px;
        font-weight: 720;
      }

      .ticker {
        display: flex;
        width: fit-content;
        max-width: 100%;
        margin: 24px auto 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .chip {
        display: inline-flex;
        min-height: 40px;
        align-items: baseline;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(0, 0, 0, 0.04);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.02);
        white-space: nowrap;
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      }

      .chip:hover { border-color: rgba(0, 0, 0, 0.07); background: rgba(0, 0, 0, 0.05); transform: translateY(-1px); }
      .chip-name { color: var(--faint); font-size: 15px; font-weight: 750; letter-spacing: 0.08em; }
      .chip-sep { color: rgba(134, 134, 139, 0.5); }
      .chip-price { color: var(--ink); font-size: 19px; font-weight: 720; }
      .chip-change { font-size: 16px; font-weight: 650; }

      .secondary-strip {
        display: flex;
        width: min(100%, 920px);
        min-width: 0;
        margin: 24px auto 0;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 12px;
        border: 1px solid rgba(20, 20, 19, 0.055);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.26);
      }

      .secondary-strip .ticker {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
      }

      .rankings {
        display: block;
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 0;
      }

      .ranking-panel {
        min-width: 0;
        padding: 6px 4px 0;
        border: 0;
        border-radius: 0;
        background: transparent;
      }

      .ranking-panel[hidden] { display: none; }

      .ranking-groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .ranking-group { min-width: 0; }

      .ranking-group-label {
        display: block;
        padding: 0 4px 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.12em;
      }

      .ranking-list {
        display: grid;
        gap: 3px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .ranking-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "name value"
          "source source";
        align-items: center;
        column-gap: 8px;
        row-gap: 2px;
        min-width: 0;
        min-height: 34px;
        padding: 4px 12px;
        border-radius: 9px;
        color: var(--ink);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        transition: background-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
      }

      .ranking-row:hover { background: rgba(0, 0, 0, 0.025); }

      .ranking-name {
        grid-area: name;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ranking-source {
        grid-area: source;
        justify-self: start;
        color: var(--faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .ranking-source-v2 { color: #816b4c; }
      .ranking-source-v3 { color: #3d7084; }
      .ranking-source-v4 { color: #806e8d; }
      .ranking-source-raydium { color: #b2744a; }
      .ranking-source-meteora { color: #7b6498; }

      .ranking-value {
        grid-area: value;
        align-self: start;
        padding-top: 2px;
        color: var(--ink);
        font-weight: 750;
        text-align: right;
      }

      .news {
        width: min(100%, 920px);
        margin: 32px auto 0;
        padding: 8px 0;
      }

      .news-row {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 16px;
        align-items: baseline;
        padding: 14px 16px;
        border-radius: 10px;
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
      }

      .news-row:hover { background: rgba(0, 0, 0, 0.025); }
      .news-time { color: #86868b; font-size: 14px; font-weight: 500; white-space: nowrap; }
      .news-headline {
        min-width: 0;
        overflow: hidden;
        color: var(--ink);
        font-size: clamp(17px, 1.35vw, 21px);
        font-weight: 500;
        line-height: 1.52;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .empty { min-height: 32px; color: var(--faint); text-align: center; }

      .kindle .price { font-size: clamp(82px, 10vw, 150px); }
      .kindle .news-headline { font-size: clamp(20px, 2.2vw, 25px); line-height: 1.55; }
      .kindle .news-time { font-size: 16px; }

      @keyframes price-pulse { 0% { opacity: 0.86; } 100% { opacity: 1; } }
      @keyframes dot-breathe { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } }

      @media (max-width: 720px) {
        .page { padding-top: max(18px, calc(env(safe-area-inset-top) + 18px)); padding-right: max(16px, calc(env(safe-area-inset-right) + 16px)); padding-bottom: max(22px, calc(env(safe-area-inset-bottom) + 22px)); padding-left: max(16px, calc(env(safe-area-inset-left) + 16px)); }
        .island { padding: 20px 18px 22px; border-radius: 30px; }
        .price { font-size: clamp(58px, 17vw, 94px); }
        .secondary-strip { width: 100%; margin-top: 18px; gap: 6px; padding: 8px 8px 10px; }
        .secondary-strip .ticker { width: 100%; margin: 0; }
        .ticker { margin-top: 0; gap: 6px; }
        .chip { min-height: 36px; padding: 7px 10px; }
        .chip-name { font-size: 12px; }
        .chip-price { font-size: 16px; }
        .chip-change { font-size: 14px; }
        .rankings { width: 100%; }
        .ranking-panel { padding-right: 4px; padding-left: 4px; }
        .ranking-groups { grid-template-columns: minmax(0, 1fr); gap: 8px; }
        .ranking-list { grid-template-columns: minmax(0, 1fr); }
        .ranking-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name value" "source source"; gap: 2px 6px; min-height: 34px; padding: 0 4px; font-size: 12px; }
        .news { margin-top: 20px; }
        .news-row { grid-template-columns: 50px minmax(0, 1fr); gap: 10px; padding: 11px 8px; }
        .news-headline { font-size: 16px; line-height: 1.45; }
      }

      @media (orientation: landscape) and (max-height: 620px) {
        .page { padding-top: max(12px, calc(env(safe-area-inset-top) + 12px)); }
        .island { padding-top: 14px; padding-bottom: 16px; }
        .price { font-size: clamp(54px, 12vh, 92px); }
        .secondary-strip { margin-top: 12px; }
        .news { margin-top: 12px; }
        .news-row { padding-top: 7px; padding-bottom: 7px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="island" aria-label="BTC 实时价格">
        <div class="island-topline">
          <span class="asset-mark">BTC</span>
          <span id="connection" class="connection-dot" aria-label="实时连接"></span>
          <span id="change" class="change">—</span>
        </div>
        <div id="price" class="price" aria-live="polite">—</div>
        <div id="benchmark" class="benchmark" aria-label="BTC 日线 EMA200"><span>日线 EMA200</span><strong>—</strong></div>
      </section>

      <section id="secondary-strip" class="secondary-strip" aria-label="关联行情与链上手续费" hidden>
        <section id="ticker" class="ticker" aria-label="关联行情"></section>
        <section id="rankings" class="rankings" aria-label="Uniswap 与 Solana 手续费榜单" hidden>
          <section id="fee-leaders" class="ranking-panel" aria-label="Uniswap 与 Solana 实物资产/USDC、普通币手续费榜前三" hidden></section>
        </section>
      </section>
      <section id="news" class="news" aria-label="律动新闻"></section>
    </main>

    <script>
      (function () {
        "use strict";

        var CACHE_KEY = "btc-local-terminal-public-v5";
        var UNISWAP_FEE_SNAPSHOT_URL = "./uniswap-fee.json";
        var SOLANA_FEE_SNAPSHOT_URL = "https://fengxiong111.github.io/lp-decision-os/top3.json";
        var HYPERLIQUID_INFO_URL = "https://api.hyperliquid.xyz/info";
        var STALE_MS = 60 * 60 * 1000;
        var UNISWAP_FEE_STALE_MS = 30 * 60 * 1000;
        var SOLANA_FEE_STALE_MS = 30 * 60 * 1000;
        var PRICE_INTERVAL = 1000;
        var STATS_INTERVAL = 15000;
        var MACRO_INTERVAL = 3000;
        var NEWS_INTERVAL = 20000;
        var EMA_INTERVAL = 60000;
        var EMA_PERIOD = 200;
        var EMA_CANDLE_LIMIT = 240;
        var priceElement = document.getElementById("price");
        var changeElement = document.getElementById("change");
        var secondaryStripElement = document.getElementById("secondary-strip");
        var tickerElement = document.getElementById("ticker");
        var rankingsElement = document.getElementById("rankings");
        var feeLeadersElement = document.getElementById("fee-leaders");
        var newsElement = document.getElementById("news");
        var connectionElement = document.getElementById("connection");
        var benchmarkElement = document.querySelector("#benchmark strong");
        var shownPrice = null;
        var priceAnimation = null;
        var priceRequest = false;
        var statsRequest = false;
        var macroRequest = false;
        var newsRequest = false;
        var feeLeadersRequest = false;
        var emaRequest = false;
        var cachedState = readCache();
        var macroItemsById = {};
        var lastMacroMarkup = "";
        var lastFeeLeadersMarkup = "";
        var HIP3_STOCK_DEX = "xyz";
        var macroDefinitions = [
          { id: "hype", label: "HYPE", source: "hyperliquid" },
          { id: "spcx", label: "SPCX", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "SPCXUSDT" },
          { id: "mu", label: "MU", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "MUUSDT" },
          { id: "sndk", label: "SNDK", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "SNDKUSDT" },
          { id: "nvda", label: "NVDA", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "NVDAUSDT" }
        ];

        if (/kindle|silk|kftt|kfot|kfjw|kfsowi|kfarwi|kfapwi|kfmawi/i.test(navigator.userAgent || "")) {
          document.documentElement.className = "kindle";
        }

        if (cachedState) {
          if (cachedState.btc) renderBtc(cachedState.btc, true);
          if (finite(cachedState.ema200) !== null) renderEma200(cachedState.ema200);
          if (cachedState.macro) renderMacro(cachedState.macro);
          if (cachedState.uniswapFeeLeaders || cachedState.solanaFeeLeaders) renderFeeLeaders(cachedState.uniswapFeeLeaders, cachedState.solanaFeeLeaders);
          if (cachedState.news) renderNews(cachedState.news);
        }

        function finite(value) {
          var number = Number(value);
          return isFinite(number) ? number : null;
        }

        function numberText(value, fraction) {
          var number = finite(value);
          if (number === null) return "—";
          try {
            return new Intl.NumberFormat("en-US", {
              minimumFractionDigits: fraction,
              maximumFractionDigits: fraction
            }).format(number);
          } catch (error) {
            return number.toFixed(fraction);
          }
        }

        function pctText(value, fraction) {
          var number = finite(value);
          if (number === null) return "—";
          var digits = typeof fraction === "number" ? fraction : 2;
          return (number >= 0 ? "+" : "") + number.toFixed(digits) + "%";
        }

        function requestJson(url, timeout, requestOptions) {
          if (window.fetch) {
            var controller = typeof AbortController === "function" ? new AbortController() : null;
            var timer = window.setTimeout(function () { if (controller) controller.abort(); }, timeout || 8000);
            var options = { cache: "no-store", mode: "cors" };
            if (requestOptions) {
              Object.keys(requestOptions).forEach(function (key) { options[key] = requestOptions[key]; });
            }
            if (controller) options.signal = controller.signal;
            var clearTimer = function () { window.clearTimeout(timer); };
            return window.fetch(url, options).then(function (response) {
              if (!response.ok) throw new Error("HTTP " + response.status);
              return response.json();
            }).then(function (value) {
              clearTimer();
              return value;
            }, function (error) {
              clearTimer();
              throw error;
            });
          }

          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            var method = requestOptions && requestOptions.method ? requestOptions.method : "GET";
            xhr.open(method, url, true);
            xhr.timeout = timeout || 8000;
            if (requestOptions && requestOptions.headers) {
              Object.keys(requestOptions.headers).forEach(function (key) { xhr.setRequestHeader(key, requestOptions.headers[key]); });
            }
            xhr.onreadystatechange = function () {
              if (xhr.readyState !== 4) return;
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); } catch (error) { reject(error); }
              } else reject(new Error("HTTP " + xhr.status));
            };
            xhr.onerror = reject;
            xhr.ontimeout = function () { reject(new Error("timeout")); };
            xhr.send(requestOptions && requestOptions.body ? requestOptions.body : null);
          });
        }

        function readCache() {
          try {
            var value = window.localStorage.getItem(CACHE_KEY);
            if (!value) return null;
            var parsed = JSON.parse(value);
            if (!parsed || !parsed.savedAt || Date.now() - parsed.savedAt > STALE_MS) return parsed;
            return parsed;
          } catch (error) {
            return null;
          }
        }

        function writeCache() {
          try {
            window.localStorage.setItem(CACHE_KEY, JSON.stringify({
              savedAt: Date.now(),
              btc: cachedState && cachedState.btc,
              macro: cachedState && cachedState.macro,
              uniswapFeeLeaders: cachedState && cachedState.uniswapFeeLeaders,
              solanaFeeLeaders: cachedState && cachedState.solanaFeeLeaders,
              ema200: cachedState && cachedState.ema200,
              news: cachedState && cachedState.news
            }));
          } catch (error) {
            // Private browsing or a restricted Kindle browser may disable storage.
          }
        }

        function renderEma200(value) {
          var ema = finite(value);
          if (ema === null || !benchmarkElement) return;
          benchmarkElement.textContent = numberText(ema, 0);
          cachedState = cachedState || {};
          cachedState.ema200 = ema;
        }

        function fetchEma200() {
          if (emaRequest) return;
          emaRequest = true;
          var endTime = Date.now();
          var startTime = endTime - EMA_CANDLE_LIMIT * 24 * 60 * 60 * 1000;
          requestJson(HYPERLIQUID_INFO_URL, 8000, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ type: "candleSnapshot", req: { coin: "BTC", interval: "1d", startTime: startTime, endTime: endTime } })
          }).then(function (candles) {
            var closes = (Array.isArray(candles) ? candles : []).map(function (item) {
              return { time: finite(item && item.t), close: finite(item && item.c) };
            }).filter(function (item) { return item.time !== null && item.close !== null; }).sort(function (left, right) { return left.time - right.time; });
            if (closes.length < EMA_PERIOD) throw new Error("日线数据不足，无法计算 EMA200");
            var sum = 0;
            for (var index = 0; index < EMA_PERIOD; index += 1) sum += closes[index].close;
            var ema = sum / EMA_PERIOD;
            var multiplier = 2 / (EMA_PERIOD + 1);
            for (var next = EMA_PERIOD; next < closes.length; next += 1) ema = (closes[next].close - ema) * multiplier + ema;
            renderEma200(ema);
            writeCache();
          }).catch(function () {
            if (cachedState && finite(cachedState.ema200) !== null) renderEma200(cachedState.ema200);
          }).then(function () { emaRequest = false; }, function () { emaRequest = false; });
        }

        function animatePrice(next) {
          if (shownPrice === null || !window.requestAnimationFrame) {
            shownPrice = next;
            priceElement.textContent = numberText(next, 0);
            return;
          }
          if (Math.abs(next - shownPrice) < 0.005) return;
          if (priceAnimation) window.cancelAnimationFrame(priceAnimation);
          var from = shownPrice;
          var start = Date.now();
          var duration = 280;
          function frame() {
            var progress = Math.min(1, (Date.now() - start) / duration);
            var eased = 1 - Math.pow(1 - progress, 3);
            var value = from + (next - from) * eased;
            shownPrice = value;
            priceElement.textContent = numberText(value, 0);
            if (progress < 1) priceAnimation = window.requestAnimationFrame(frame);
            else {
              shownPrice = next;
              priceElement.textContent = numberText(next, 0);
              priceAnimation = null;
            }
          }
          priceElement.classList.remove("price-pulse");
          void priceElement.offsetWidth;
          priceElement.classList.add("price-pulse");
          priceAnimation = window.requestAnimationFrame(frame);
        }

        function renderBtc(btc, instant) {
          var previous = cachedState && cachedState.btc ? cachedState.btc : {};
          var nextBtc = Object.assign({}, previous, btc);
          var price = finite(btc.price);
          var change = finite(btc.change);
          if (price !== null) {
            if (instant) {
              shownPrice = price;
              priceElement.textContent = numberText(price, 0);
            } else animatePrice(price);
          }
          changeElement.textContent = pctText(change);
          changeElement.className = "change " + (change !== null && change >= 0 ? "up" : "down");
          connectionElement.style.background = "var(--up)";
          cachedState = cachedState || {};
          cachedState.btc = nextBtc;
        }

        function renderMacro(items) {
          (items || []).forEach(function (item) {
            if (!item || finite(item.price) === null) return;
            macroItemsById[item.id] = Object.assign({}, macroItemsById[item.id] || {}, item);
          });
          var validItems = macroDefinitions.map(function (definition) { return macroItemsById[definition.id]; }).filter(function (item) { return item && finite(item.price) !== null; });
          var markup = validItems.map(function (item) {
            var price = finite(item.price);
            var change = finite(item.change);
            var fraction = price >= 1000 ? 0 : price >= 10 ? 2 : 3;
            var tone = change !== null && change >= 0 ? "up" : "down";
            var changeMarkup = change === null ? "" : "<span class=\"chip-change " + tone + "\">" + pctText(change) + "</span>";
            return "<span class=\"chip\"><span class=\"chip-name\">" + item.label + "</span><span class=\"chip-sep\">|</span><span class=\"chip-price\">" + numberText(price, fraction) + "</span>" + changeMarkup + "</span>";
          }).join("");
          if (markup !== lastMacroMarkup) {
            tickerElement.innerHTML = markup;
            lastMacroMarkup = markup;
          }
          cachedState = cachedState || {};
          cachedState.macro = validItems;
          updateSecondaryLayout();
        }

        function escapeHtml(value) {
          return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function rankFeeRows(rows, limit) {
          return (rows || []).slice().sort(function (left, right) {
            return right.fee - left.fee || (Number(left.rank) || 0) - (Number(right.rank) || 0) || left.pair.localeCompare(right.pair);
          }).slice(0, limit);
        }

        function updateRankingLayout() {
          if (!rankingsElement) return;
          rankingsElement.hidden = !feeLeadersElement || feeLeadersElement.hidden;
          updateSecondaryLayout();
        }

        function updateSecondaryLayout() {
          if (!secondaryStripElement) return;
          var hasTicker = Boolean(tickerElement && tickerElement.children.length > 0);
          var hasRankings = Boolean(rankingsElement && !rankingsElement.hidden);
          secondaryStripElement.hidden = !hasTicker && !hasRankings;
        }

        function normalizeUniswapFeeSnapshot(payload) {
          if (!payload || payload.schemaVersion !== 1 || payload.source !== "uniswap-explore-stats") {
            throw new Error("Uniswap fee snapshot unsupported");
          }
          var generatedAt = typeof payload.generatedAt === "string" ? payload.generatedAt : "";
          if (!generatedAt || !isFinite(Date.parse(generatedAt))) throw new Error("Uniswap fee snapshot time invalid");
          var allRows = Array.isArray(payload.rows) ? payload.rows.map(function (row) {
            if (!row || ["V2", "V3", "V4"].indexOf(row.protocol) < 0) return null;
            var fee = finite(row.fee24h);
            var volume = finite(row.volume24h);
            var feeRate = finite(row.feeRate);
            if (typeof row.pair !== "string" || !row.pair.trim() || typeof row.chain !== "string" || !row.chain.trim() || typeof row.poolAddress !== "string" || !row.poolAddress.trim() || fee === null || fee <= 0 || volume === null || volume <= 0 || feeRate === null || feeRate <= 0) return null;
            return { rank: finite(row.rank) || 0, protocol: row.protocol, chain: row.chain, pair: row.pair.trim(), fee: fee, poolAddress: row.poolAddress, volume: volume, feeRate: feeRate, isRwa: row.isRwa === true, isRwaUsdc: row.isRwaUsdc === true };
          }).filter(Boolean) : [];
          if (allRows.length === 0) throw new Error("Uniswap fee snapshot has no usable rows");
          return {
            generatedAt: generatedAt,
            fetchedAt: Date.now(),
            rows: rankFeeRows(allRows, 5),
            rwaUsdcRows: rankFeeRows(allRows.filter(function (row) { return row.isRwaUsdc; }), 3),
            coinRows: rankFeeRows(allRows.filter(function (row) { return !row.isRwa; }), 3),
            stale: Date.now() - Date.parse(generatedAt) > UNISWAP_FEE_STALE_MS
          };
        }

        function pairTokens(pair) {
          return String(pair || "").split(/[\s/|:+_-]+/).filter(Boolean);
        }

        function isStockMappedPair(pair) {
          return pairTokens(pair).some(function (token) { return token.toUpperCase() === "RWA" || /^[A-Z0-9]+x$/.test(token); });
        }

        function isRwaUsdcPair(pair) {
          var tokens = pairTokens(pair);
          return tokens.some(function (token) { return token.toUpperCase() === "USDC"; }) && isStockMappedPair(pair);
        }

        function normalizeSolanaFeeSnapshot(payload) {
          if (!payload || payload.schemaVersion !== 2 || payload.product !== "Solana LP Decision OS") {
            throw new Error("Solana fee snapshot unsupported");
          }
          var generatedAt = typeof payload.generatedAt === "string" ? payload.generatedAt : "";
          if (!generatedAt || !isFinite(Date.parse(generatedAt))) throw new Error("Solana fee snapshot time invalid");
          var candidates = payload.scanner && Array.isArray(payload.scanner.candidates) ? payload.scanner.candidates : [];
          var allRows = candidates.map(function (row) {
            if (!row || (row.dex !== "Raydium" && row.dex !== "Meteora")) return null;
            var fee = finite(row.lpFee24h);
            if (typeof row.pair !== "string" || !row.pair.trim() || fee === null || fee <= 0 || typeof row.poolAddress !== "string" || !row.poolAddress.trim()) return null;
            return { rank: finite(row.rank) || 0, protocol: row.dex, pair: row.pair.trim(), poolAddress: row.poolAddress, poolType: typeof row.poolType === "string" ? row.poolType : "", fee: fee };
          }).filter(Boolean);
          if (allRows.length === 0) throw new Error("Solana fee snapshot has no usable rows");
          return {
            generatedAt: generatedAt,
            fetchedAt: Date.now(),
            rwaUsdcRows: rankFeeRows(allRows.filter(function (row) { return isRwaUsdcPair(row.pair); }), 3),
            coinRows: rankFeeRows(allRows.filter(function (row) { return !isStockMappedPair(row.pair); }), 3),
            stale: Date.now() - Date.parse(generatedAt) > SOLANA_FEE_STALE_MS
          };
        }

        function renderFeeLeaders(uniswapSnapshot, solanaSnapshot) {
          if (!feeLeadersElement) return;
          var uniswapRwaRows = uniswapSnapshot && Array.isArray(uniswapSnapshot.rwaUsdcRows) ? uniswapSnapshot.rwaUsdcRows : [];
          var uniswapCoinRows = uniswapSnapshot && Array.isArray(uniswapSnapshot.coinRows) ? uniswapSnapshot.coinRows : [];
          var solanaRwaRows = solanaSnapshot && Array.isArray(solanaSnapshot.rwaUsdcRows) ? solanaSnapshot.rwaUsdcRows : [];
          var solanaCoinRows = solanaSnapshot && Array.isArray(solanaSnapshot.coinRows) ? solanaSnapshot.coinRows : [];
          if (uniswapRwaRows.length === 0 && uniswapCoinRows.length === 0 && solanaRwaRows.length === 0 && solanaCoinRows.length === 0) {
            feeLeadersElement.innerHTML = "";
            feeLeadersElement.hidden = true;
            lastFeeLeadersMarkup = "";
            updateRankingLayout();
            return;
          }
          var renderUniswapRows = function (groupRows) {
            return groupRows.map(function (row) {
              return "<li class=\"ranking-row\"><span class=\"ranking-name\" title=\"" + escapeHtml(row.pair + " · " + row.protocol + " · " + row.chain) + "\">" + escapeHtml(row.pair) + "</span><span class=\"ranking-source ranking-source-" + row.protocol.toLowerCase() + "\">" + escapeHtml(row.protocol + " · " + row.chain) + "</span><span class=\"ranking-value\">" + numberText(row.fee, row.fee >= 1000 ? 0 : 2) + "</span></li>";
            }).join("");
          };
          var renderSolanaRows = function (groupRows) {
            return groupRows.map(function (row) {
              return "<li class=\"ranking-row\"><span class=\"ranking-name\" title=\"" + escapeHtml(row.pair + " · " + row.protocol + (row.poolType ? " · " + row.poolType : "")) + "\">" + escapeHtml(row.pair) + "</span><span class=\"ranking-source ranking-source-" + row.protocol.toLowerCase() + "\">" + escapeHtml(row.protocol) + "</span><span class=\"ranking-value\">" + numberText(row.fee, row.fee >= 1000 ? 0 : 2) + "</span></li>";
            }).join("");
          };
          var markup = "<div class=\"ranking-groups\">";
          if (uniswapRwaRows.length > 0) markup += "<section class=\"ranking-group\" aria-label=\"Uniswap 实物资产 USDC 股票映射代币费用前三\"><span class=\"ranking-group-label\">UNISWAP · 实物资产 / USDC</span><ul class=\"ranking-list\">" + renderUniswapRows(uniswapRwaRows) + "</ul></section>";
          if (uniswapCoinRows.length > 0) markup += "<section class=\"ranking-group\" aria-label=\"Uniswap 普通代币费用前三\"><span class=\"ranking-group-label\">UNISWAP · 代币</span><ul class=\"ranking-list\">" + renderUniswapRows(uniswapCoinRows) + "</ul></section>";
          if (solanaRwaRows.length > 0) markup += "<section class=\"ranking-group\" aria-label=\"Solana 实物资产 USDC 股票映射代币费用前三\"><span class=\"ranking-group-label\">SOLANA · 实物资产 / USDC</span><ul class=\"ranking-list\">" + renderSolanaRows(solanaRwaRows) + "</ul></section>";
          if (solanaCoinRows.length > 0) markup += "<section class=\"ranking-group\" aria-label=\"Solana 普通代币费用前三\"><span class=\"ranking-group-label\">SOLANA · 代币</span><ul class=\"ranking-list\">" + renderSolanaRows(solanaCoinRows) + "</ul></section>";
          markup += "</div>";
          if (markup !== lastFeeLeadersMarkup) {
            feeLeadersElement.innerHTML = markup;
            lastFeeLeadersMarkup = markup;
          }
          feeLeadersElement.hidden = false;
          cachedState = cachedState || {};
          cachedState.uniswapFeeLeaders = uniswapSnapshot;
          cachedState.solanaFeeLeaders = solanaSnapshot;
          updateRankingLayout();
        }

        function cleanTitle(value) {
          if (typeof value !== "string") return null;
          var title = value.replace(/^观点[:：]\s*/, "").replace(/\s+/g, " ").trim();
          return title.length > 0 ? title : null;
        }

        function safeHref(value) {
          var raw = typeof value === "string" && value ? value : "https://fengxiong111.github.io/lydong-screen/";
          return /^https?:\/\//i.test(raw) ? raw : "https://fengxiong111.github.io/lydong-screen/";
        }

        function renderNews(items) {
          var validItems = (items || []).filter(function (item) { return cleanTitle(item.title); }).slice(0, 8);
          newsElement.innerHTML = validItems.map(function (item) {
            var title = cleanTitle(item.title);
            var time = typeof item.ts === "string" ? item.ts.slice(11, 16) : "";
            var href = safeHref(item.url);
            return "<a class=\"news-row\" href=\"" + href.replace(/\"/g, "&quot;") + "\" target=\"_blank\" rel=\"noreferrer\"><span class=\"news-time\">" + time + "</span><span class=\"news-headline\">" + title.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</span></a>";
          }).join("");
          cachedState = cachedState || {};
          cachedState.news = validItems;
        }

        function fetchBtc() {
          if (priceRequest) return;
          priceRequest = true;
          var fallback = requestJson("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT", 2500).then(function (ticker) {
            var price = finite(ticker.price);
            if (price === null) throw new Error("Binance BTC price unavailable");
            return { price: price };
          }).catch(function () {
            return requestJson(HYPERLIQUID_INFO_URL, 2500, {
              method: "POST",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify({ type: "allMids" })
            }).then(function (mids) {
              var price = finite(mids && mids.BTC);
              if (price === null) throw new Error("Hyperliquid BTC price unavailable");
              return { price: price };
            });
          });
          fallback.then(function (quote) {
            var previous = cachedState && cachedState.btc ? cachedState.btc : {};
            var priceChanged = previous.price !== quote.price;
            renderBtc({ price: quote.price, change: previous.change }, false);
            if (priceChanged) writeCache();
          }).catch(function () {
            if (cachedState && cachedState.btc) renderBtc(cachedState.btc, true);
          }).then(function () { priceRequest = false; });
        }

        function fetchBtcStats() {
          if (statsRequest) return;
          statsRequest = true;
          requestJson("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT", 3000).then(function (ticker) {
            if (!cachedState || !cachedState.btc) return;
            var change = finite(ticker.priceChangePercent);
            var changeChanged = cachedState.btc.change !== change;
            renderBtc({ price: cachedState.btc.price, change: change }, true);
            if (changeChanged) writeCache();
          }).then(function () { statsRequest = false; }, function () { statsRequest = false; });
        }

        function fetchHyperliquidMacro(definitions, dex) {
          if (!definitions.length) return Promise.resolve([]);
          var body = { type: "metaAndAssetCtxs" };
          if (dex) body.dex = dex;
          return requestJson(HYPERLIQUID_INFO_URL, 2500, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(body)
          }).then(function (payload) {
            var meta = payload && payload[0];
            var contexts = payload && payload[1];
            var universe = meta && Array.isArray(meta.universe) ? meta.universe : [];
            return definitions.map(function (definition) {
              var expectedName = (dex ? dex + ":" : "") + definition.label;
              var index = universe.findIndex(function (item) {
                return item && (item.name === expectedName || (!dex && item.name === definition.label));
              });
              var context = Array.isArray(contexts) && index >= 0 ? contexts[index] : null;
              var price = context ? finite(context.markPx || context.midPx) : null;
              var previous = context ? finite(context.prevDayPx) : null;
              if (price === null) return null;
              var sourceName = universe[index] && typeof universe[index].name === "string" ? universe[index].name : expectedName;
              return {
                id: definition.id,
                label: definition.label,
                symbol: "HYPERLIQUID:" + sourceName,
                price: price,
                change: previous !== null && previous > 0 ? ((price - previous) / previous) * 100 : null
              };
            }).filter(function (item) { return item !== null; });
          });
        }

        function fetchBinanceMacro(definitions) {
          return Promise.all(definitions.map(function (definition) {
            return requestJson("https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=" + definition.symbol, 3000).then(function (ticker) {
              var price = finite(ticker.lastPrice);
              var change = finite(ticker.priceChangePercent);
              if (ticker.symbol !== definition.symbol || price === null) throw new Error(definition.label + " price unavailable");
              return { id: definition.id, label: definition.label, symbol: "BINANCE-FUTURES:" + definition.symbol, price: price, change: change };
            }).catch(function () { return null; });
          })).then(function (items) {
            return items.filter(function (item) { return item !== null; });
          });
        }

        function fetchMacro() {
          if (macroRequest) return;
          macroRequest = true;
          var hypeDefinitions = macroDefinitions.filter(function (definition) { return !definition.dex; });
          var stockDefinitions = macroDefinitions.filter(function (definition) { return definition.dex === HIP3_STOCK_DEX; });
          Promise.all([
            fetchHyperliquidMacro(hypeDefinitions).catch(function () { return []; }),
            fetchHyperliquidMacro(stockDefinitions, HIP3_STOCK_DEX).catch(function () { return []; })
          ]).then(function (groups) {
            var items = groups[0].concat(groups[1]);
            if (items.length > 0) {
              renderMacro(items);
              writeCache();
            }
            var available = {};
            items.forEach(function (item) { available[item.id] = true; });
            var missingStocks = stockDefinitions.filter(function (definition) { return !available[definition.id]; });
            return fetchBinanceMacro(missingStocks);
          }).then(function (fallbackItems) {
            if (fallbackItems.length > 0) {
              renderMacro(fallbackItems);
              writeCache();
            }
          }).then(function () { macroRequest = false; }, function () { macroRequest = false; });
        }

        function fetchNews() {
          if (newsRequest) return;
          newsRequest = true;
          var urls = [
            "https://fengxiong111.github.io/lydong-screen/feed.json",
            "https://raw.githubusercontent.com/fengxiong111/lydong-screen/main/feed.json"
          ];
          var attempt = function (index) {
            if (index >= urls.length) return Promise.reject(new Error("news unavailable"));
            return requestJson(urls[index], 9000).catch(function () { return attempt(index + 1); });
          };
          attempt(0).then(function (items) {
            var list = Array.isArray(items) ? items : (items && Array.isArray(items.items) ? items.items : []);
            list.sort(function (a, b) { return String(b.ts || b.time || "").localeCompare(String(a.ts || a.time || "")); });
            renderNews(list);
            writeCache();
          }).catch(function () {
            if (cachedState && cachedState.news) renderNews(cachedState.news);
          }).then(function () { newsRequest = false; });
        }

        function fetchFeeLeaders() {
          if (feeLeadersRequest) return;
          feeLeadersRequest = true;
          var uniswapRequest = requestJson(UNISWAP_FEE_SNAPSHOT_URL + "?v=" + Date.now(), 9000)
            .then(normalizeUniswapFeeSnapshot)
            .catch(function () { return cachedState && cachedState.uniswapFeeLeaders ? Object.assign({}, cachedState.uniswapFeeLeaders, { stale: true }) : null; });
          var solanaRequest = requestJson(SOLANA_FEE_SNAPSHOT_URL + "?v=" + Date.now(), 9000)
            .then(normalizeSolanaFeeSnapshot)
            .catch(function () { return cachedState && cachedState.solanaFeeLeaders ? Object.assign({}, cachedState.solanaFeeLeaders, { stale: true }) : null; });
          Promise.all([uniswapRequest, solanaRequest]).then(function (snapshots) {
            if (snapshots[0] || snapshots[1]) {
              renderFeeLeaders(snapshots[0], snapshots[1]);
              writeCache();
            }
          }).then(function () { feeLeadersRequest = false; }, function () { feeLeadersRequest = false; });
        }

        function refreshAll() {
          fetchBtc();
          fetchBtcStats();
          fetchEma200();
          fetchMacro();
          fetchFeeLeaders();
          fetchNews();
        }

        refreshAll();
        window.setInterval(fetchBtc, PRICE_INTERVAL);
        window.setInterval(fetchBtcStats, STATS_INTERVAL);
        window.setInterval(fetchEma200, EMA_INTERVAL);
        window.setInterval(fetchMacro, MACRO_INTERVAL);
        window.setInterval(fetchFeeLeaders, 60000);
        window.setInterval(fetchNews, NEWS_INTERVAL);
        window.addEventListener("focus", refreshAll, { passive: true });
        window.addEventListener("pageshow", refreshAll, { passive: true });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") refreshAll();
        });
      }());
    </script>
  </body>
</html>
