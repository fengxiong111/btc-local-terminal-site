<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#eef2ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>市场</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("./fonts/JetBrainsMono-variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --bg: #eef2ee;
        --surface: #f8faf7;
        --surface-strong: #ffffff;
        --surface-muted: #e7ece8;
        --text: #202925;
        --muted: #78847d;
        --strong: #2d3933;
        --up: #147c5b;
        --down: #b6535c;
        --pending: #a4773c;
        --shadow-card: 0 16px 32px rgba(43, 61, 50, 0.09), 0 3px 8px rgba(43, 61, 50, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.88);
        --radius-card: 16px;
      }

      * { box-sizing: border-box; }

      html {
        min-width: 0;
        min-height: 100%;
        background: var(--bg);
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-x: none;
      }

      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.95), transparent 35%),
          radial-gradient(circle at 96% 10%, rgba(214, 229, 218, 0.54), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", "SFMono-Regular", "PingFang SC", "Microsoft YaHei", monospace;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a { color: inherit; }

      .skip-link {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--strong);
        color: var(--surface-strong);
        text-decoration: none;
        transform: translateY(-150%);
        transition: transform 160ms ease;
      }

      .skip-link:focus { transform: translateY(0); }

      .page {
        width: min(100%, 1760px);
        min-height: 100svh;
        margin: 0 auto;
        padding-top: max(18px, calc(env(safe-area-inset-top) + 18px));
        padding-right: max(clamp(16px, 3.4vw, 64px), calc(env(safe-area-inset-right) + 16px));
        padding-bottom: max(28px, calc(env(safe-area-inset-bottom) + 28px));
        padding-left: max(clamp(16px, 3.4vw, 64px), calc(env(safe-area-inset-left) + 16px));
      }

      .market-row,
      .market-ident,
      .market-quote {
        display: flex;
      }

      .market-source {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        line-height: 14px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      :focus-visible {
        outline: 2px solid var(--strong);
        outline-offset: 3px;
      }

      .market-section { margin-top: 0; }
      .market-list { display: grid; min-width: 0; max-width: 1680px; margin: 0 auto; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(10px, 0.8vw, 16px); }
      .market-row { min-width: 0; min-height: clamp(104px, 7vw, 128px); flex-direction: column; align-items: stretch; justify-content: space-between; gap: 10px; padding: clamp(15px, 1.35vw, 24px); border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); }
      .market-ident { min-width: 0; flex: 1 1 auto; flex-direction: column; gap: 3px; }
      .market-symbol { color: var(--strong); font-size: clamp(16px, 1.2vw, 20px); font-weight: 600; line-height: 1.25; letter-spacing: -0.35px; }
      .market-source { overflow: hidden; color: var(--muted); font-size: clamp(10px, 0.68vw, 12px); font-weight: 500; letter-spacing: 0.3px; text-overflow: ellipsis; white-space: nowrap; text-transform: none; }
      .market-row[data-market-state="stale"] .market-source { color: var(--pending); }
      .market-quote { min-width: 0; align-items: baseline; justify-content: space-between; gap: 12px; }
      .market-price { min-width: 0; color: var(--text); font-size: clamp(16px, 1.35vw, 22px); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; white-space: nowrap; }
      .market-change { min-width: 0; color: var(--muted); font-size: clamp(12px, 0.95vw, 16px); line-height: 1.25; text-align: right; white-space: nowrap; }
      .market-change.up { color: var(--up); }
      .market-change.down { color: var(--down); }

      .market-row--btc { grid-column: span 3; min-height: clamp(188px, 14vw, 236px); padding: clamp(22px, 2vw, 36px); background: var(--surface-strong); }
      .market-row--btc .market-symbol { font-size: clamp(19px, 1.45vw, 25px); }
      .market-row--btc .market-source { font-size: clamp(10px, 0.75vw, 13px); }
      .market-row--btc .market-quote { gap: 18px; }
      .market-row--btc .market-price { display: inline-flex; flex: 0 1 auto; align-items: baseline; justify-content: flex-start; gap: 0; overflow: visible; font-size: clamp(36px, 4.2vw, 70px); line-height: 1; letter-spacing: -0.06em; white-space: nowrap; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "lnum" 1; }
      .market-row--btc .market-price .digit { position: relative; display: inline-block; width: 0.70em; height: 1em; line-height: 1em; overflow: hidden; vertical-align: baseline; padding: 0 0.02em; box-sizing: content-box; }
      .market-row--btc .market-price .sep { display: inline-block; width: 0.22em; margin: 0 -0.04em; text-align: center; opacity: 0.86; }
      .market-row--btc .market-price .track { position: absolute; inset: 0; }
      .market-row--btc .market-price .digit__num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-right: 0.03em; box-sizing: border-box; will-change: transform; }
      .market-row--btc .market-change { font-size: clamp(16px, 1.25vw, 23px); }
      .market-row--ema200,
      .market-row--ma120 { background: var(--surface-muted); }
      .market-row--ema200 .market-price,
      .market-row--ma120 .market-price { font-size: clamp(18px, 1.5vw, 25px); }

      .empty { padding: 22px 12px; color: var(--muted); font-size: 14.5px; line-height: 18px; text-align: center; }

      @media (max-width: 560px) {
        .page { padding-top: max(14px, calc(env(safe-area-inset-top) + 14px)); }
        .market-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .market-row { min-height: 92px; gap: 8px; padding: 13px; }
        .market-row--btc { grid-column: span 2; min-height: clamp(158px, 44vw, 190px); padding: 20px; }
        .market-row--btc .market-price { font-size: clamp(32px, 10vw, 48px); }
        .market-row--btc .market-change { font-size: clamp(14px, 4vw, 18px); }
        .market-row--ema200 .market-price,
        .market-row--ma120 .market-price { font-size: clamp(17px, 5vw, 22px); }
      }

      @media (orientation: landscape) and (max-height: 620px) {
        .page { padding-top: max(12px, calc(env(safe-area-inset-top) + 12px)); }
        .market-row--btc { min-height: 170px; }
      }

      @media (max-width: 1399px) and (min-width: 901px) {
        .market-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .market-row--btc { grid-column: span 2; }
      }

      @media (max-width: 900px) and (min-width: 561px) {
        .market-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .market-row--btc { grid-column: span 3; min-height: 190px; }
      }

      @media (min-width: 561px) {
        .page { display: flex; align-items: center; }
        .market-section { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#market">跳到市场行情</a>
    <main class="page">
      <section id="market" class="market-section" aria-label="市场行情">
        <div id="market-list" class="market-list" aria-live="off"><p class="empty">正在读取公开行情…</p></div>
      </section>
    </main>
    <script>
      (function () {
        "use strict";

        var CACHE_KEY = "btc-local-terminal-market-v1";
        var HYPERLIQUID_INFO_URL = "https://api.hyperliquid.xyz/info";
        var PRICE_INTERVAL = 500;
        var STATS_INTERVAL = 15000;
        var MACRO_INTERVAL = 3000;
        var EMA_INTERVAL = 60000;
        var EMA_PERIOD = 200;
        var EMA_CANDLE_LIMIT = 1000;
        var marketListElement = document.getElementById("market-list");
        var priceRequest = false;
        var statsRequest = false;
        var macroRequest = false;
        var emaRequest = false;
        var marketItemsById = {};
        var macroItemsById = {};
        var lastMarketStructure = null;
        var marketRowsById = {};
        var btcOdometer = null;
        var ANIM_MS = 450;
        var ANIM_EASE = "linear(0,.005,.019,.039,.066,.096,.129,.165,.202,.24,.278,.316,.354,.39,.426,.461,.494,.526,.557,.586,.614,.64,.665,.689,.711,.731,.751,.769,.786,.802,.817,.831,.844,.856,.867,.877,.887,.896,.904,.912,.919,.925,.931,.937,.942,.947,.951,.955,.959,.962,.965,.968,.971,.973,.976,.978,.98,.981,.983,.984,.986,.987,.988,.989,.99,.991,.992,.992,.993,.994,.994,.995,.995,.996,.996,.9963,.9967,.9969,.9972,.9975,.9977,.9979,.9981,.9982,.9984,.9985,.9987,.9988,.9989,1)";
        var HIP3_STOCK_DEX = "xyz";
        var STONK_SOLANA_ADDRESS = "6GmAFSYs4gk3FDao5FzzySQpPZaWsa4rUJHacpMpUNgx";
        var macroDefinitions = [
          { id: "hype", label: "HYPE", source: "hyperliquid" },
          { id: "pons", label: "PONS", source: "hyperliquid" },
          { id: "stonk", label: "STONK", source: "dexscreener", address: STONK_SOLANA_ADDRESS },
          { id: "spcx", label: "SPCX", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "SPCXUSDT" },
          { id: "mu", label: "MU", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "MUUSDT" },
          { id: "sndk", label: "SNDK", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "SNDKUSDT" },
          { id: "nvda", label: "NVDA", source: "hyperliquid", dex: HIP3_STOCK_DEX, symbol: "NVDAUSDT" }
        ];
        var marketDefinitions = [{ id: "btc", label: "BTC", source: "binance" }].concat([
          { id: "ema200", label: "EMA200", source: "BTC daily" },
          { id: "ma120", label: "MA120", source: "BTC daily" }
        ], macroDefinitions);
        var cachedState = readCache();

        if (cachedState) {
          if (cachedState.btc) renderBtc(cachedState.btc, true);
          if (finite(cachedState.ema200) !== null) renderEma200(cachedState.ema200, cachedState.ma120, true);
          if (cachedState.macro) renderMacro(cachedState.macro, true);
        }

        function finite(value) {
          if (value === null || value === undefined || value === "") return null;
          var number = Number(value);
          return isFinite(number) ? number : null;
        }

        function numberText(value, fraction) {
          var number = finite(value);
          if (number === null) return "—";
          try {
            return new Intl.NumberFormat("en-US", {
              minimumFractionDigits: fraction,
              maximumFractionDigits: fraction
            }).format(number);
          } catch (error) {
            return number.toFixed(fraction);
          }
        }

        function pctText(value, fraction) {
          var number = finite(value);
          if (number === null) return "—";
          var digits = typeof fraction === "number" ? fraction : 2;
          return (number >= 0 ? "+" : "") + number.toFixed(digits) + "%";
        }

        function requestJson(url, timeout, requestOptions) {
          if (window.fetch) {
            var controller = typeof AbortController === "function" ? new AbortController() : null;
            var timer = window.setTimeout(function () { if (controller) controller.abort(); }, timeout || 8000);
            var options = { cache: "no-store", mode: "cors" };
            if (requestOptions) {
              Object.keys(requestOptions).forEach(function (key) { options[key] = requestOptions[key]; });
            }
            if (controller) options.signal = controller.signal;
            var clearTimer = function () { window.clearTimeout(timer); };
            return window.fetch(url, options).then(function (response) {
              if (!response.ok) throw new Error("HTTP " + response.status);
              return response.json();
            }).then(function (value) {
              clearTimer();
              return value;
            }, function (error) {
              clearTimer();
              throw error;
            });
          }

          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            var method = requestOptions && requestOptions.method ? requestOptions.method : "GET";
            xhr.open(method, url, true);
            xhr.timeout = timeout || 8000;
            if (requestOptions && requestOptions.headers) {
              Object.keys(requestOptions.headers).forEach(function (key) { xhr.setRequestHeader(key, requestOptions.headers[key]); });
            }
            xhr.onreadystatechange = function () {
              if (xhr.readyState !== 4) return;
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); } catch (error) { reject(error); }
              } else reject(new Error("HTTP " + xhr.status));
            };
            xhr.onerror = reject;
            xhr.ontimeout = function () { reject(new Error("timeout")); };
            xhr.send(requestOptions && requestOptions.body ? requestOptions.body : null);
          });
        }

        function readCache() {
          try {
            window.localStorage.removeItem("btc-local-terminal-public-v7");
            var value = window.localStorage.getItem(CACHE_KEY);
            if (!value) return null;
            var parsed = JSON.parse(value);
            return parsed && parsed.savedAt ? parsed : null;
          } catch (error) {
            return null;
          }
        }

        function writeCache() {
          try {
            window.localStorage.setItem(CACHE_KEY, JSON.stringify({
              savedAt: Date.now(),
              btc: cachedState && cachedState.btc,
              macro: cachedState && cachedState.macro,
              ema200: cachedState && cachedState.ema200,
              ma120: cachedState && cachedState.ma120
            }));
          } catch (error) {
            // Private browsing or a restricted browser may disable storage.
          }
        }

        function sourceLabel(symbol, fallback) {
          var value = typeof symbol === "string" ? symbol : "";
          if (value.indexOf("HYPERLIQUID:") === 0) return "Hyperliquid";
          if (value.indexOf("DEXSCREENER:") === 0) return "DexScreener · Solana";
          if (value.indexOf("BINANCE:") === 0 || value.indexOf("BINANCE-") === 0) return "Binance";
          return fallback || "公开数据";
        }

        function priceFraction(value) {
          var price = finite(value);
          if (price === null) return 2;
          if (price >= 1000) return 0;
          if (price >= 10) return 2;
          if (price >= 1) return 3;
          if (price >= 0.01) return 4;
          return 6;
        }

        function normalizedChange(item) {
          if (!item) return null;
          return finite(item.change !== undefined ? item.change : item.change24h);
        }

        function replaceChildrenCompat(element, child) {
          while (element.firstChild) element.removeChild(element.firstChild);
          element.appendChild(child);
        }

        function createBtcOdometer(priceElement) {
          var currentTemplate = "";
          var lastShown = "";
          var inited = false;
          var digitCellHeight = 0;
          var integerFormatter;
          try {
            integerFormatter = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
          } catch (error) {
            integerFormatter = null;
          }

          function formatIntString(value) {
            var number = finite(value);
            if (number === null || number <= 0) return null;
            try {
              return integerFormatter ? integerFormatter.format(Math.round(number)) : String(Math.round(number));
            } catch (error) {
              return String(Math.round(number));
            }
          }

          function cancelAnimations(element) {
            if (!element || typeof element.getAnimations !== "function") return;
            element.getAnimations().forEach(function (animation) { animation.cancel(); });
          }

          function buildOdometer(text) {
            while (priceElement.firstChild) priceElement.removeChild(priceElement.firstChild);
            for (var index = 0; index < text.length; index += 1) {
              var character = text.charAt(index);
              if (character >= "0" && character <= "9") {
                var digit = document.createElement("span");
                digit.className = "digit";
                digit.dataset.value = character;

                var track = document.createElement("span");
                track.className = "track";
                for (var number = 0; number <= 9; number += 1) {
                  var cell = document.createElement("span");
                  cell.className = "digit__num";
                  cell.textContent = String(number);
                  cell.dataset.num = String(number);
                  track.appendChild(cell);
                }

                digit.appendChild(track);
                priceElement.appendChild(digit);
              } else {
                var separator = document.createElement("span");
                separator.className = "sep";
                separator.textContent = character;
                priceElement.appendChild(separator);
              }
            }
          }

          function refreshCellHeight() {
            var digit = priceElement.querySelector(".digit");
            if (digit) digitCellHeight = digit.getBoundingClientRect().height || digitCellHeight;
            return digitCellHeight;
          }

          function digitOffset(value, current) {
            var offset = (value - current + 10) % 10;
            if (offset > 5) offset -= 10;
            return offset;
          }

          function digitTranslatePx(value, digit, cellHeight) {
            return digitOffset(value, Number(digit)) * cellHeight;
          }

          function positionDigit(track, digit, instant, previousDigit) {
            var cellHeight = refreshCellHeight();
            if (!cellHeight) return;
            var previous = previousDigit === undefined ? digit : previousDigit;
            cancelAnimations(track);
            var nodes = track.querySelectorAll(".digit__num");
            for (var index = 0; index < nodes.length; index += 1) {
              var node = nodes[index];
              var value = Number(node.dataset.num);
              var fromY = digitTranslatePx(value, previous, cellHeight);
              var toY = digitTranslatePx(value, digit, cellHeight);

              cancelAnimations(node);
              if (instant || typeof node.animate !== "function") {
                node.style.transform = "translate3d(0, " + toY + "px, 0)";
                continue;
              }

              node.style.transform = "translate3d(0, " + toY + "px, 0)";
              node.animate([
                { transform: "translate3d(0, " + fromY + "px, 0)" },
                { transform: "translate3d(0, " + toY + "px, 0)" }
              ], { duration: ANIM_MS, easing: ANIM_EASE, fill: "both" });
            }
          }

          function setAllInstant(text) {
            if (currentTemplate !== text || !priceElement.children.length) {
              buildOdometer(text);
              refreshCellHeight();
            }

            var nodes = priceElement.children;
            var index = 0;
            for (var characterIndex = 0; characterIndex < text.length; characterIndex += 1) {
              var character = text.charAt(characterIndex);
              var node = nodes[index++];
              if (!node) break;
              if (node.classList.contains("digit")) {
                node.dataset.value = character;
                positionDigit(node.querySelector(".track"), character, true);
              } else {
                node.textContent = character;
              }
            }

            currentTemplate = text;
            lastShown = text;
            inited = true;
          }

          function animateTo(text) {
            if (!inited || text.length !== currentTemplate.length) {
              setAllInstant(text);
              return;
            }

            var nodes = priceElement.children;
            var index = 0;
            for (var characterIndex = 0; characterIndex < text.length; characterIndex += 1) {
              var character = text.charAt(characterIndex);
              var node = nodes[index++];
              if (!node) break;
              if (node.classList.contains("digit")) {
                if (node.dataset.value !== character) {
                  var previous = node.dataset.value;
                  node.dataset.value = character;
                  positionDigit(node.querySelector(".track"), character, false, previous);
                }
              } else if (node.textContent !== character) {
                node.textContent = character;
              }
            }

            currentTemplate = text;
            lastShown = text;
          }

          function setBtcPrice(value, instant) {
            var text = formatIntString(value);
            if (!text) return;
            var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (instant || reducedMotion || !inited || text.length !== currentTemplate.length) {
              setAllInstant(text);
            } else if (text !== lastShown) {
              animateTo(text);
            }
          }

          function refitCurrent() {
            if (!inited || !lastShown) return;
            refreshCellHeight();
            setAllInstant(lastShown);
          }

          return { setBtcPrice: setBtcPrice, refitCurrent: refitCurrent };
        }

        function createMarketRow(item) {
          var row = document.createElement("div");
          row.className = "market-row market-row--" + item.id;

          var ident = document.createElement("div");
          ident.className = "market-ident";
          var symbol = document.createElement("strong");
          symbol.className = "market-symbol";
          var source = document.createElement("span");
          source.className = "market-source";
          ident.append(symbol, source);

          var quote = document.createElement("div");
          quote.className = "market-quote";
          var priceElement = document.createElement("span");
          priceElement.className = "market-price" + (item.id === "btc" ? " odometer" : "");
          var changeElement = document.createElement("span");
          changeElement.className = "market-change";
          quote.append(priceElement, changeElement);
          row.append(ident, quote);
          row._marketRefs = { symbol: symbol, source: source, price: priceElement, change: changeElement };
          return row;
        }

        function updateMarketRow(item, row) {
          if (!row || !row._marketRefs) return;
          var refs = row._marketRefs;
          var price = finite(item.price);
          var change = normalizedChange(item);
          row.className = "market-row market-row--" + item.id;
          row.setAttribute("data-market-id", item.id);
          row.setAttribute("data-market-state", item.stale ? "stale" : "live");
          refs.symbol.textContent = item.label || item.id.toUpperCase();
          refs.source.textContent = sourceLabel(item.symbol, item.source) + (item.stale ? " · 缓存" : "");

          if (item.id === "btc") {
            if (!btcOdometer) btcOdometer = createBtcOdometer(refs.price);
            btcOdometer.setBtcPrice(price, false);
          } else {
            refs.price.textContent = numberText(price, priceFraction(price));
          }

          refs.change.className = "market-change";
          refs.change.textContent = change === null ? "—" : pctText(change);
          if (change !== null) refs.change.classList.add(change >= 0 ? "up" : "down");
        }

        function renderMarketBoard() {
          if (!marketListElement) return;
          var validItems = marketDefinitions.map(function (definition) {
            return marketItemsById[definition.id];
          }).filter(function (item) {
            return item && finite(item.price) !== null;
          });
          if (!validItems.length) {
            if (lastMarketStructure !== "empty") {
              var empty = document.createElement("p");
              empty.className = "empty";
              empty.textContent = "正在读取公开行情…";
              replaceChildrenCompat(marketListElement, empty);
              lastMarketStructure = "empty";
              marketRowsById = {};
              btcOdometer = null;
            }
            return;
          }

          var marketStructure = validItems.map(function (item) {
            return [item.id, item.label, item.source, item.symbol, item.stale ? "stale" : "live"].join(":");
          }).join("|");
          if (marketStructure !== lastMarketStructure) {
            lastMarketStructure = marketStructure;
            marketRowsById = {};
            btcOdometer = null;
            var fragment = document.createDocumentFragment();
            validItems.forEach(function (item) {
              var row = createMarketRow(item);
              marketRowsById[item.id] = row;
              fragment.append(row);
            });
            replaceChildrenCompat(marketListElement, fragment);
          }

          validItems.forEach(function (item) {
            updateMarketRow(item, marketRowsById[item.id]);
          });
        }

        function renderEma200(value, ma120, isStale) {
          var ema = finite(value);
          var ma = finite(ma120);
          var stale = Boolean(isStale);
          cachedState = cachedState || {};
          if (ema !== null) {
            cachedState.ema200 = ema;
            marketItemsById.ema200 = { id: "ema200", label: "EMA200", source: "BTC daily", symbol: "BTC-1D", price: ema, change: null, stale: stale };
          }
          if (ma !== null) {
            cachedState.ma120 = ma;
            marketItemsById.ma120 = { id: "ma120", label: "MA120", source: "BTC daily", symbol: "BTC-1D", price: ma, change: null, stale: stale };
          }
          if (ema !== null || ma !== null) renderMarketBoard();
        }

        function fetchEma200() {
          if (emaRequest) return;
          emaRequest = true;
          requestJson("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=" + EMA_CANDLE_LIMIT, 8000).then(function (candles) {
            var closes = (Array.isArray(candles) ? candles : []).map(function (item) { return finite(item && item[4]); }).filter(function (value) { return value !== null && value > 0; });
            if (closes.length < EMA_PERIOD || closes.length < 120) throw new Error("Binance 日线数据不足");
            var sum = 0;
            for (var index = 0; index < EMA_PERIOD; index += 1) sum += closes[index];
            var ema = sum / EMA_PERIOD;
            var multiplier = 2 / (EMA_PERIOD + 1);
            for (var next = EMA_PERIOD; next < closes.length; next += 1) ema = (closes[next] - ema) * multiplier + ema;
            var maStart = closes.length - 120;
            var maSum = 0;
            for (var maIndex = maStart; maIndex < closes.length; maIndex += 1) maSum += closes[maIndex];
            renderEma200(ema, maSum / 120, false);
            writeCache();
          }).catch(function () {
            if (cachedState && finite(cachedState.ema200) !== null) renderEma200(cachedState.ema200, cachedState.ma120, true);
          }).then(function () { emaRequest = false; }, function () { emaRequest = false; });
        }

        function renderBtc(btc, isStale) {
          var previous = cachedState && cachedState.btc ? cachedState.btc : {};
          var nextBtc = Object.assign({}, previous, btc);
          var stale = typeof isStale === "boolean" ? isStale : Boolean(marketItemsById.btc && marketItemsById.btc.stale);
          var price = finite(btc.price);
          if (price !== null) {
            marketItemsById.btc = {
              id: "btc",
              label: "BTC",
              source: "binance",
              symbol: "BINANCE:BTCUSDT",
              price: price,
              change: finite(btc.change),
              stale: stale
            };
            renderMarketBoard();
          }
          cachedState = cachedState || {};
          cachedState.btc = nextBtc;
        }

        function renderMacro(items, isStale) {
          var hasStaleOverride = typeof isStale === "boolean";
          (items || []).forEach(function (item) {
            if (!item || finite(item.price) === null) return;
            var nextItem = Object.assign({}, macroItemsById[item.id] || {}, item);
            if (hasStaleOverride) nextItem.stale = isStale;
            macroItemsById[item.id] = nextItem;
            marketItemsById[item.id] = macroItemsById[item.id];
          });
          var validItems = macroDefinitions.map(function (definition) { return macroItemsById[definition.id]; }).filter(function (item) { return item && finite(item.price) !== null; });
          cachedState = cachedState || {};
          cachedState.macro = validItems;
          if (validItems.length) {
            renderMarketBoard();
          }
        }

        function refitBtcPrice() {
          if (!btcOdometer) return;
          window.setTimeout(function () {
            if (btcOdometer) btcOdometer.refitCurrent();
          }, 80);
        }

        function fetchBtc() {
          if (priceRequest) return;
          priceRequest = true;
          var fallback = requestJson("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT", 2500).then(function (ticker) {
            var price = finite(ticker.price);
            if (price === null) throw new Error("Binance BTC price unavailable");
            return { price: price };
          }).catch(function () {
            return requestJson(HYPERLIQUID_INFO_URL, 2500, {
              method: "POST",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify({ type: "allMids" })
            }).then(function (mids) {
              var price = finite(mids && mids.BTC);
              if (price === null) throw new Error("Hyperliquid BTC price unavailable");
              return { price: price };
            });
          });
          fallback.then(function (quote) {
            var previous = cachedState && cachedState.btc ? cachedState.btc : {};
            var priceChanged = previous.price !== quote.price;
            renderBtc({ price: quote.price, change: previous.change }, false);
            if (priceChanged) writeCache();
          }).catch(function () {
            if (cachedState && cachedState.btc) {
              renderBtc(cachedState.btc, true);
            }
          }).then(function () { priceRequest = false; });
        }

        function fetchBtcStats() {
          if (statsRequest) return;
          statsRequest = true;
          requestJson("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT", 3000).then(function (ticker) {
            if (!cachedState || !cachedState.btc) return;
            var change = finite(ticker.priceChangePercent);
            var changeChanged = cachedState.btc.change !== change;
            renderBtc({ price: cachedState.btc.price, change: change });
            if (changeChanged) writeCache();
          }).then(function () { statsRequest = false; }, function () { statsRequest = false; });
        }

        function fetchHyperliquidMacro(definitions, dex) {
          if (!definitions.length) return Promise.resolve([]);
          var body = { type: "metaAndAssetCtxs" };
          if (dex) body.dex = dex;
          return requestJson(HYPERLIQUID_INFO_URL, 2500, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(body)
          }).then(function (payload) {
            var meta = payload && payload[0];
            var contexts = payload && payload[1];
            var universe = meta && Array.isArray(meta.universe) ? meta.universe : [];
            return definitions.map(function (definition) {
              var expectedName = (dex ? dex + ":" : "") + definition.label;
              var index = universe.findIndex(function (item) {
                return item && (item.name === expectedName || (!dex && item.name === definition.label));
              });
              var context = Array.isArray(contexts) && index >= 0 ? contexts[index] : null;
              var price = context ? finite(context.markPx || context.midPx) : null;
              var previous = context ? finite(context.prevDayPx) : null;
              if (price === null) return null;
              var sourceName = universe[index] && typeof universe[index].name === "string" ? universe[index].name : expectedName;
              return {
                id: definition.id,
                label: definition.label,
                symbol: "HYPERLIQUID:" + sourceName,
                price: price,
                change: previous !== null && previous > 0 ? ((price - previous) / previous) * 100 : null
              };
            }).filter(function (item) { return item !== null; });
          });
        }

        function fetchBinanceMacro(definitions) {
          return Promise.all(definitions.map(function (definition) {
            return requestJson("https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=" + definition.symbol, 3000).then(function (ticker) {
              var price = finite(ticker.lastPrice);
              var change = finite(ticker.priceChangePercent);
              if (ticker.symbol !== definition.symbol || price === null) throw new Error(definition.label + " price unavailable");
              return { id: definition.id, label: definition.label, symbol: "BINANCE-FUTURES:" + definition.symbol, price: price, change: change };
            }).catch(function () { return null; });
          })).then(function (items) {
            return items.filter(function (item) { return item !== null; });
          });
        }

        function fetchDexScreenerMacro(definitions) {
          return Promise.all(definitions.map(function (definition) {
            return requestJson("https://api.dexscreener.com/latest/dex/tokens/" + definition.address, 3000).then(function (payload) {
              var pairs = payload && Array.isArray(payload.pairs) ? payload.pairs : [];
              pairs = pairs.filter(function (pair) {
                return pair && pair.chainId === "solana" && pair.baseToken && pair.baseToken.address === definition.address && finite(pair.priceUsd) !== null;
              }).sort(function (left, right) { return (right.liquidity && finite(right.liquidity.usd) || 0) - (left.liquidity && finite(left.liquidity.usd) || 0); });
              var pair = pairs[0];
              if (!pair) throw new Error(definition.label + " price unavailable");
              return {
                id: definition.id,
                label: definition.label,
                symbol: "DEXSCREENER:SOLANA:" + definition.address,
                price: finite(pair.priceUsd),
                change: pair.priceChange ? finite(pair.priceChange.h24) : null
              };
            }).catch(function () { return null; });
          })).then(function (items) {
            return items.filter(function (item) { return item !== null; });
          });
        }

        function fetchMacro() {
          if (macroRequest) return;
          macroRequest = true;
          var hypeDefinitions = macroDefinitions.filter(function (definition) { return definition.source === "hyperliquid" && !definition.dex; });
          var stockDefinitions = macroDefinitions.filter(function (definition) { return definition.dex === HIP3_STOCK_DEX; });
          var dexDefinitions = macroDefinitions.filter(function (definition) { return definition.source === "dexscreener"; });
          Promise.all([
            fetchHyperliquidMacro(hypeDefinitions).catch(function () { return []; }),
            fetchHyperliquidMacro(stockDefinitions, HIP3_STOCK_DEX).catch(function () { return []; }),
            fetchDexScreenerMacro(dexDefinitions)
          ]).then(function (groups) {
            var items = groups[0].concat(groups[1], groups[2]);
            if (items.length > 0) {
              renderMacro(items, false);
              writeCache();
            }
            var available = {};
            items.forEach(function (item) { available[item.id] = true; });
            var missingStocks = stockDefinitions.filter(function (definition) { return !available[definition.id]; });
            return fetchBinanceMacro(missingStocks);
          }).then(function (fallbackItems) {
            if (fallbackItems.length > 0) {
              renderMacro(fallbackItems, false);
              writeCache();
            }
          }).then(function () { macroRequest = false; }, function () { macroRequest = false; });
        }

        function refreshAll() {
          fetchBtc();
          fetchBtcStats();
          fetchEma200();
          fetchMacro();
        }

        refreshAll();
        window.setInterval(fetchBtc, PRICE_INTERVAL);
        window.setInterval(fetchBtcStats, STATS_INTERVAL);
        window.setInterval(fetchEma200, EMA_INTERVAL);
        window.setInterval(fetchMacro, MACRO_INTERVAL);
        window.addEventListener("focus", refreshAll, { passive: true });
        window.addEventListener("pageshow", function () {
          refreshAll();
          refitBtcPrice();
        }, { passive: true });
        window.addEventListener("orientationchange", refitBtcPrice, { passive: true });
        window.addEventListener("resize", refitBtcPrice, { passive: true });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitBtcPrice).catch(function () {});
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") refreshAll();
        });
      }());
    </script>
  </body>
</html>
